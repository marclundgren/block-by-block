<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block by Block: Python · Minecraft · Full-Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>(function(){var t=localStorage.getItem("bxb-theme");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);})();</script>
<style>
/* ===========================================================
   Block by Block, GitHub Primer docs × Minecraft
   Light + dark themes (toggle), system type, pixel accents.
   =========================================================== */
:root{
  /* GitHub Primer LIGHT */
  --bg:#ffffff; --bg2:#f6f8fa; --panel:#f6f8fa; --panel2:#eaeef2;
  --ink:#1f2328; --soft:#3d444d; --muted:#59636e; --faint:#818b98;
  --line:#d1d9e0; --line2:#d8dee4;
  --grass:#1f883d; --grass-bri:#2da44e; --grass-dim:#aceebb;
  --link:#0969da; --amber:#9a6700; --amber-bg:#fff8c5; --red:#cf222e;
  --purple:#8250df; --blue-bg:#ddf4ff;
  --code-bg:#f6f8fa; --code-bd:#d1d9e0; --code-ink:#1f2328;
  --synK:#cf222e; --synS:#0a3069; --synC:#6e7781; --synF:#8250df; --synN:#0550ae; --synO:#cf222e; --synA:#6639ba;
  --shadow:0 1px 0 rgba(31,35,40,.04), 0 8px 24px -12px rgba(31,35,40,.2);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --pixel:"Silkscreen",ui-monospace,monospace;
  --r:6px;
}
html[data-theme="dark"]{
  /* GitHub dark */
  --bg:#0d1117; --bg2:#010409; --panel:#161b22; --panel2:#1c2128;
  --ink:#e6edf3; --soft:#c9d1d9; --muted:#9198a1; --faint:#6e7681;
  --line:#30363d; --line2:#3d444d;
  --grass:#238636; --grass-bri:#3fb950; --grass-dim:#1b4721;
  --link:#4493f8; --amber:#d29922; --amber-bg:#272115; --red:#f85149;
  --purple:#bc8cff; --blue-bg:#121d2f;
  --code-bg:#161b22; --code-bd:#30363d; --code-ink:#e6edf3;
  --synK:#ff7b72; --synS:#a5d6ff; --synC:#8b949e; --synF:#d2a8ff; --synN:#79c0ff; --synO:#ff7b72; --synA:#d2a8ff;
  --shadow:0 8px 24px -12px rgba(1,4,9,.8);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
/* faint blocky backdrop, barely-there in light, subtle in dark */
.iso{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(currentColor 1px, transparent 1px);
  background-size:22px 22px; color:var(--line);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 40%,#000 70%,transparent);
          mask-image:linear-gradient(180deg,transparent,#000 40%,#000 70%,transparent);}
html[data-theme="dark"] .iso{opacity:.25}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--grass-dim);color:var(--ink)}

/* ---------- top bar ---------- */
header.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;
  padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--line);
  box-shadow:inset 0 3px 0 var(--grass-bri);}   /* grass-green strip on top */
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.cube{width:26px;height:26px;flex:none;image-rendering:pixelated}
.brand b{font-family:var(--pixel);font-weight:400;font-size:13px;letter-spacing:.02em;color:var(--ink)}
.brand b span{color:var(--grass-bri)}
.search{margin-left:auto;position:relative}
.search input{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:var(--r);padding:6px 10px 6px 30px;width:220px;outline:none;transition:.15s}
.search input:focus{border-color:var(--link);width:260px;box-shadow:0 0 0 3px var(--blue-bg)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.6;stroke:var(--muted)}
.search-results{position:absolute;top:40px;right:0;width:330px;background:var(--bg);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:none}
.search-results.show{display:block}
.search-results a{display:block;padding:9px 13px;color:var(--soft);font-size:14px;border-bottom:1px solid var(--line)}
.search-results a:hover{background:var(--panel);color:var(--ink);text-decoration:none}
.search-results .pt{color:var(--faint);font-size:11px}
.theme-toggle{flex:none;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r);color:var(--muted);transition:.15s}
.theme-toggle:hover{border-color:var(--grass);color:var(--grass);background:var(--panel)}
.theme-toggle .moon{display:none}
html[data-theme="dark"] .theme-toggle .sun{display:none}
html[data-theme="dark"] .theme-toggle .moon{display:block}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
nav.toc{border-right:1px solid var(--line);background:var(--bg2);padding:20px 12px 120px;
  position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto}
nav.toc::-webkit-scrollbar{width:10px}
nav.toc::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid var(--bg2)}
.part{margin-bottom:4px}
.part>.phead{display:flex;align-items:center;gap:9px;padding:9px 10px 6px;cursor:pointer;border-radius:var(--r)}
.part>.phead:hover{background:var(--panel2)}
.pnum{font-family:var(--pixel);font-size:11px;color:#fff;background:var(--grass);border-radius:4px;
  padding:3px 6px;flex:none;image-rendering:pixelated}
.ptitle{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3}
.part .lessons{margin:2px 0 4px;overflow:hidden;transition:max-height .3s ease}
.lk{display:flex;align-items:center;gap:9px;padding:6px 10px 6px 14px;border-radius:var(--r);
  color:var(--muted);cursor:pointer;font-size:14px;line-height:1.4}
.lk:hover{background:var(--panel2);color:var(--ink)}
.lk.active{background:var(--blue-bg);color:var(--ink);font-weight:600;
  box-shadow:inset 3px 0 0 var(--grass-bri)}
html[data-theme="dark"] .lk.active{background:var(--panel2)}
.tick{width:16px;height:16px;flex:none;border:1.5px solid var(--line2);border-radius:4px;
  display:grid;place-items:center;transition:.15s;background:var(--bg)}
.lk.done .tick{background:var(--grass);border-color:var(--grass)}
.tick svg{opacity:0} .lk.done .tick svg{opacity:1}
.lk.done .lbl{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--grass)}

/* ---------- reading pane ---------- */
main{overflow:hidden}
.wrap{max-width:830px;margin:0 auto;padding:40px 40px 160px}
.crumb{font-family:var(--pixel);font-size:10px;letter-spacing:.02em;color:var(--grass);
  margin-bottom:16px;display:flex;gap:9px;align-items:center;text-transform:uppercase}
.crumb .dot{width:5px;height:5px;background:var(--muted);border-radius:1px}
h1.title{font-family:var(--sans);font-weight:600;font-size:clamp(28px,4vw,38px);line-height:1.2;
  letter-spacing:-.01em;margin:0 0 8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.lede{font-size:18px;color:var(--muted);margin:0 0 28px}
.content h2{font-family:var(--sans);font-weight:600;font-size:23px;margin:38px 0 14px;
  padding-bottom:8px;border-bottom:1px solid var(--line)}   /* GitHub markdown h2 */
.content h3{font-family:var(--sans);font-weight:600;font-size:18px;margin:26px 0 8px;color:var(--ink)}
.content p{margin:13px 0;color:var(--soft)}
.content strong{color:var(--ink);font-weight:600}
.content ul,.content ol{color:var(--soft);padding-left:24px}
.content li{margin:6px 0}
.content li::marker{color:var(--faint)}
.content code{font-family:var(--mono);font-size:.85em;background:var(--panel2);
  padding:.16em .4em;border-radius:4px;color:var(--ink)}
html[data-theme="dark"] .content code{background:rgba(110,118,129,.4)}
kbd{font-family:var(--mono);font-size:.78em;background:var(--bg2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:.1em .45em;color:var(--ink)}

/* code blocks */
pre{position:relative;margin:18px 0;background:var(--code-bg);border:1px solid var(--code-bd);
  border-radius:var(--r);overflow:hidden}
pre .bar{display:flex;align-items:center;gap:8px;padding:7px 13px;border-bottom:1px solid var(--code-bd);
  background:var(--bg2)}
pre .bar .lang{font-family:var(--mono);font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
pre .bar .dots{display:flex;gap:5px}
pre .bar .dots i{width:9px;height:9px;border-radius:2px;display:block;image-rendering:pixelated}
pre .copy{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);
  background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:3px 9px;cursor:pointer}
pre .copy:hover{color:var(--grass);border-color:var(--grass)}
pre code{display:block;font-family:var(--mono);font-size:13px;line-height:1.65;
  padding:14px 16px;overflow-x:auto;color:var(--code-ink);background:none}
pre code .c{color:var(--synC);font-style:italic}
pre code .k{color:var(--synK)}
pre code .s{color:var(--synS)}
pre code .f{color:var(--synF)}
pre code .n{color:var(--synN)}
pre code .o{color:var(--synO)}
pre code .nd{color:var(--synA)}

/* callouts, GitHub alert style + Minecraft "Quest" */
.box{margin:18px 0;border-radius:var(--r);padding:13px 16px 13px 16px;border:1px solid var(--line);
  border-left:4px solid var(--muted);background:var(--bg);font-size:15px;line-height:1.55}
.box .h{font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;margin-bottom:4px}
.box .h::before{font-family:var(--mono);font-size:13px}
.box p{margin:5px 0;color:var(--soft)}
.box.note{border-left-color:var(--link)} .box.note .h{color:var(--link)} .box.note .h::before{content:"❖"}
.box.tip{border-left-color:var(--grass-bri)} .box.tip .h{color:var(--grass-bri)} .box.tip .h::before{content:"◆"}
.box.warn{border-left-color:var(--amber)} .box.warn{background:var(--amber-bg)} .box.warn .h{color:var(--amber)} .box.warn .h::before{content:"▲"}
.box.try{border-left-color:var(--purple)} .box.try .h{color:var(--purple);font-family:var(--pixel);font-weight:400;font-size:12px;letter-spacing:.02em} .box.try .h::before{content:"⛏";font-size:14px}
.box.try .h::after{content:"QUEST"}

/* prev / next */
.pager{display:flex;gap:12px;margin-top:48px;border-top:1px solid var(--line);padding-top:22px}
.pager a{flex:1;display:block;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--bg);transition:.15s}
.pager a:hover{border-color:var(--grass);background:var(--panel);text-decoration:none}
.pager .dir{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.pager .nm{color:var(--link);font-size:15px;margin-top:3px;font-weight:600}
.pager .nx{text-align:right}
.markbtn{display:inline-flex;align-items:center;gap:9px;margin-top:30px;cursor:pointer;
  font-family:var(--sans);font-size:14px;font-weight:600;color:#fff;background:var(--grass);
  border:1px solid rgba(31,35,40,.15);border-radius:var(--r);padding:9px 18px;transition:.15s}
.markbtn:hover{background:var(--grass-bri)}
.markbtn.done{background:var(--bg);color:var(--grass);border:1px solid var(--line)}
.markbtn:disabled,.markbtn:disabled:hover{opacity:.45;cursor:not-allowed;background:var(--grass)}

/* in-lesson multiple-choice quiz */
.quiz{margin:14px 0 2px}
.quiz .qq{font-weight:600;color:var(--ink);margin:0 0 10px;font-size:15px}
.quiz .opts{display:flex;flex-direction:column;gap:8px}
.quiz .opt{text-align:left;cursor:pointer;font-family:var(--sans);font-size:14px;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 13px;transition:.15s}
.quiz .opt:hover{border-color:var(--grass)}
.quiz .opt.correct{border-color:var(--grass-bri);background:var(--grass-dim);color:var(--ink);font-weight:600}
.quiz .opt.wrong{border-color:var(--red);background:var(--amber-bg)}
.quiz.solved .opt{cursor:default;pointer-events:none}
.quiz.solved .opt:not(.correct){opacity:.5}
.quiz-msg{min-height:18px;margin:10px 0 0;font-size:13px;font-weight:600}
.quiz-msg.ok{color:var(--grass-bri)} .quiz-msg.no{color:var(--red)}

/* ---------- cover ---------- */
.cover{padding:60px 40px 160px;max-width:1000px;margin:0 auto}
.cover .kick{font-family:var(--pixel);font-size:12px;letter-spacing:.04em;color:var(--grass-bri);margin-bottom:20px;text-transform:uppercase}
.cover h1{font-family:var(--sans);font-weight:700;font-size:clamp(40px,7vw,76px);line-height:1.02;
  letter-spacing:-.03em;margin:0;color:var(--ink)}
.cover h1 em{font-style:normal;color:var(--grass-bri);display:block}
.cover .sub{font-size:20px;color:var(--muted);max-width:660px;margin:24px 0 0;line-height:1.5}
.cover .meta{font-family:var(--mono);font-size:13px;color:var(--muted);margin:26px 0 36px;display:flex;flex-wrap:wrap;gap:8px 16px}
.cover .meta span{display:flex;align-items:center;gap:6px}
.cover .meta b{color:var(--grass-bri)}
.begin{font-family:var(--sans);font-weight:600;font-size:15px;background:var(--grass);color:#fff;
  border:1px solid rgba(31,35,40,.15);border-radius:var(--r);padding:12px 26px;cursor:pointer;transition:.15s}
.begin:hover{background:var(--grass-bri);transform:translateY(-1px)}
.parts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:56px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:22px;background:var(--bg);cursor:pointer;transition:.18s}
.pcard:hover{transform:translateY(-3px);border-color:var(--grass);box-shadow:var(--shadow)}
.pcard .pn{font-family:var(--pixel);font-size:30px;color:var(--grass-dim);line-height:1}
html[data-theme="dark"] .pcard .pn{color:var(--line2)}
.pcard:hover .pn{color:var(--grass-bri)}
.pcard h3{font-family:var(--sans);font-weight:600;font-size:19px;margin:14px 0 6px;color:var(--ink)}
.pcard p{font-size:14px;color:var(--muted);margin:0;line-height:1.45}
.pcard .cnt{font-family:var(--mono);font-size:11px;color:var(--grass-bri);margin-top:14px;display:block}

/* ---------- XP bar ---------- */
.xp{position:fixed;left:300px;right:0;bottom:0;z-index:30;background:var(--bg);
  border-top:1px solid var(--line);padding:9px 22px;display:flex;align-items:center;gap:16px}
.xp .lvl{position:relative;width:38px;height:38px;flex:none;display:grid;place-items:center}
.xp .lvl svg{position:absolute;inset:0}
.xp .lvl svg circle:first-child{stroke:var(--line)}
.xp .lvl svg #ring{stroke:var(--grass-bri)}
.xp .lvl b{font-family:var(--pixel);font-size:13px;color:var(--grass-bri);z-index:1}
.xp .track{flex:1;height:11px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;overflow:hidden}
html[data-theme="dark"] .xp .track{background:#010409}
.xp .fill{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--grass-bri) 0,var(--grass-bri) 6px,var(--grass) 6px,var(--grass) 8px);
  transition:width .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 8px rgba(63,185,80,.5)}
.xp .stat{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none;white-space:nowrap}
.xp .stat b{color:var(--grass-bri)}
.xp .reset{font-family:var(--mono);font-size:11px;color:var(--faint);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 9px;cursor:pointer}
.xp .reset:hover{color:var(--red);border-color:var(--red)}

/* responsive */
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  nav.toc{position:fixed;left:0;top:54px;width:290px;z-index:35;transform:translateX(-105%);transition:.3s;box-shadow:var(--shadow)}
  nav.toc.open{transform:none}
  .xp{left:0}
  .wrap,.cover{padding-left:20px;padding-right:20px}
  .menu-btn{display:grid!important}
  .search input{width:150px} .search input:focus{width:170px}
}
.menu-btn{display:none;place-items:center;width:34px;height:34px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.menu-btn div{width:16px;height:2px;background:var(--ink);box-shadow:0 5px 0 var(--ink),0 -5px 0 var(--ink)}

/* ---------- secret chapter (bonus) ---------- */
:root{ --gold:#9a6700; }
html[data-theme="dark"]{ --gold:#e3b341; }
.bonus-link{display:flex;align-items:center;gap:11px;margin:0 4px 16px;padding:11px 12px;cursor:pointer;
  border:1px solid var(--gold);border-radius:var(--r);
  background:linear-gradient(90deg,rgba(227,179,65,.14),transparent);transition:.15s}
.bonus-link:hover{background:linear-gradient(90deg,rgba(227,179,65,.24),transparent)}
.bonus-link.active{box-shadow:inset 3px 0 0 var(--gold)}
.bonus-link .bk{font-size:18px;color:var(--gold);flex:none}
.bonus-link .bt{font-family:var(--pixel);font-size:11px;color:var(--gold);line-height:1.4}
.bonus-link .bs{font-size:12px;color:var(--muted);margin-top:2px}
.unlock-toast{position:fixed;left:50%;bottom:64px;transform:translate(-50%,30px);z-index:60;opacity:0;
  background:var(--bg);border:1px solid var(--gold);border-left:4px solid var(--gold);border-radius:10px;
  padding:14px 18px;box-shadow:var(--shadow);max-width:90vw;font-size:14px;color:var(--ink);
  transition:opacity .4s, transform .4s;text-align:center}
.unlock-toast.show{opacity:1;transform:translate(-50%,0)}
.unlock-toast b{color:var(--gold)} .unlock-toast span{color:var(--muted);font-size:13px}
.unlock-toast a{display:inline-block;margin-top:8px;cursor:pointer;font-weight:600;color:var(--gold)}
</style>
</head>
<body>
<div class="iso"></div>

<header class="top">
  <div class="menu-btn" onclick="document.querySelector('nav.toc').classList.toggle('open')"><div></div></div>
  <div class="brand" onclick="go('cover')">
    <svg class="cube" viewBox="0 0 32 32" fill="none"><path d="M16 2 29 9 16 16 3 9z" fill="#6cc24a"/><path d="M3 9 16 16v14L3 23z" fill="#8a6a43"/><path d="M29 9 16 16v14l13-7z" fill="#6b5230"/></svg>
    <b>Block&nbsp;<span>by</span>&nbsp;Block</b>
  </div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#828d9c" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="text" placeholder="search lessons…" autocomplete="off">
    <div class="search-results" id="qres"></div>
  </div>
  <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="Toggle light / dark" aria-label="Toggle theme">
    <svg class="sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg>
    <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
  </button>
</header>

<div class="shell">
  <nav class="toc" id="toc"></nav>
  <main><div id="view"></div></main>
</div>

<div class="xp">
  <div class="lvl">
    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#0c3a1d" stroke-width="3"/><circle id="ring" cx="20" cy="20" r="17" fill="none" stroke="#5fcf80" stroke-width="3" stroke-linecap="round" stroke-dasharray="107" stroke-dashoffset="107" transform="rotate(-90 20 20)" style="transition:stroke-dashoffset .5s"/></svg>
    <b id="lvlnum">0</b>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="stat"><b id="done">0</b> / <span id="total">0</span> lessons crafted</div>
  <button class="reset" onclick="resetProgress()">reset</button>
</div>

<!-- ============================ LESSON CONTENT ============================ -->

<template data-id="p0-1"><div class="content">
<p>Welcome. This book turns a Minecraft server into a place to learn real programming, step by step, block by block. No experience needed. If you can install an app and type into a terminal, you can do this.</p>
<h2>What you'll build</h2>
<p>Everything here is anchored to one thing: a Minecraft server you run yourself. You'll write Python that talks to it, mods that run inside it, and by the end a web dashboard that watches it live. Abstract lessons are hard to care about, so every concept is tied to something you can see happen in a world you control.</p>
<p>Along the way you'll pick up a real, high level feel for how networking works, how game servers work, and what self hosting means. None of it goes deep, but you'll come out understanding the shape of all three, which is more than most people ever get.</p>
<div class="box note"><span class="h">Pick your platform first</span><p>Setup depends on your computer. Most readers are on Windows, so that is the default path here. Jump to the one that fits you:</p>
<p><strong>→ <a onclick="go('p0-3')" style="cursor:pointer">Windows + WSL2</a></strong> (the recommended default)<br>
<strong>→ <a onclick="go('p0-4')" style="cursor:pointer">macOS</a></strong> (a little different, and a little simpler)<br>
<strong>→ <a onclick="go('p0-5')" style="cursor:pointer">Other paths</a></strong> (native Windows, or a Raspberry Pi)</p>
<p>The next lesson explains why WSL is the pick.</p></div>
<h2>The four parts</h2>
<p><strong>0, Launchpad:</strong> get your machine ready and run the server.<br>
<strong>1, Python:</strong> from your first <code>print()</code> to classes, generators, and typing.<br>
<strong>2, Minecraft:</strong> Fabric mods, events, commands, mixins.<br>
<strong>3, Full-Stack:</strong> HTTP, a FastAPI backend, and a live web dashboard wired to your server.</p>
<h2>How to use it</h2>
<ul>
<li>Go in order your first time through. Later parts lean on earlier ones.</li>
<li>Every lesson ends with a <span style="color:var(--purple)">⛏ Quest</span>. Do it. Reading code is not the same as writing it.</li>
<li>Tap <strong>Mark complete</strong> to fill your XP bar. On a keyboard, use the arrow keys to move and <kbd>c</kbd> to mark a lesson done.</li>
<li>Your progress saves in your browser, so there is no account and nothing in the cloud.</li>
</ul>
<div class="box try"><span class="h"></span><p>Tap <strong>Mark complete</strong> below, then go to "Pick your path" to sort out your setup.</p></div>
</div></template>

<template data-id="p0-2"><div class="content">
<p>Before installing anything, figure out where your server and your code will live. There are a few valid options. They are all listed below, but one is the recommended default, because choosing for yourself is hard at the start.</p>
<h2>The default: Windows with WSL2</h2>
<p>Most people reading this are on a Windows PC. If that is you, install <strong>WSL2</strong> (Windows Subsystem for Linux). It gives you a real Linux system running inside Windows, with no separate machine and no dual boot.</p>
<h3>Why Linux for this</h3>
<p>Almost all of the backend and server world runs on Linux. The tools you'll use (Docker, Python, and the Minecraft server image) are happiest there. WSL2 also tends to be much faster than plain Windows for the kind of work developers do, especially anything that touches a lot of files, like installing packages or building a project. If you have heard someone say their project crawled on Windows but flew on WSL, that is the file system difference at work.</p>
<div class="box note"><span class="h">Does WSL make Minecraft itself faster?</span><p>Not really, and that is worth being clear about. A Minecraft server runs on Java, which performs about the same on Windows and on WSL2 (WSL2 is a lightweight real Linux VM, so the raw speed is close). The reason to use WSL here is not a giant Minecraft speed boost. It is that the whole toolchain is cleaner, the Docker setup just works, and you learn Linux while you are at it.</p></div>
<h3>The sneaky benefit: you learn Linux</h3>
<p>Even when you are not writing code, the operating system is a big part of any real dev setup. Learning the Linux basics (moving around folders, running commands, permissions) is valuable on its own. You'll use it for the rest of your coding life, so picking it up now while having fun with Minecraft is a great deal. It is not the only option, but it is the one worth learning.</p>
<h2>All the paths, quickly</h2>
<p>Pick the line that matches you and follow that lesson. You do not need to read the others.</p>
<ul>
<li><strong>On Windows?</strong> Use <a onclick="go('p0-3')" style="cursor:pointer">Windows + WSL2</a>. This is the main path the rest of the book assumes.</li>
<li><strong>On a Mac?</strong> Go to <a onclick="go('p0-4')" style="cursor:pointer">Set up on a Mac</a>. macOS is already Unix underneath, so you skip WSL entirely.</li>
<li><strong>On Windows but your hardware can't run WSL2?</strong> Rare, but it happens. See <a onclick="go('p0-5')" style="cursor:pointer">Other paths</a> for a native Windows setup and the trade-offs.</li>
<li><strong>Got a Raspberry Pi or a little home server?</strong> You can host on those too. The idea, and the catch, are in <a onclick="go('p0-5')" style="cursor:pointer">Other paths</a>.</li>
</ul>
<div class="box tip"><span class="h">You can change your mind</span><p>None of this locks you in. The Python, the mods, and the web app are the same no matter where the server runs. Only these first few setup steps change.</p></div>
<div class="box try"><span class="h"></span><p>Decide your path and open its setup lesson. On Windows and unsure? Go with WSL2.</p></div>
</div></template>

<template data-id="p0-4"><div class="content">
<p>On a Mac, the road is easier than on Windows. macOS is built on Unix, which is close enough to Linux that you do not need WSL at all. The built in <strong>Terminal</strong> app is already a real shell.</p>
<h2>1. Open Terminal</h2>
<p>Press <kbd>Cmd</kbd>+<kbd>Space</kbd>, type <strong>Terminal</strong>, and hit enter. This is where you run commands. Try one:</p>
<pre><code class="language-bash">uname -a</code></pre>
<h2>2. Install Docker Desktop</h2>
<p>Download <strong>Docker Desktop for Mac</strong> from docker.com, and grab the build for your chip:</p>
<ul>
<li><strong>Apple Silicon</strong> (M1, M2, M3, and newer): the "Apple chip" download.</li>
<li><strong>Intel</strong> (older Macs): the "Intel chip" download.</li>
<li>Not sure? Click the Apple menu, choose "About This Mac", and read the chip line.</li>
</ul>
<p>Install it like any Mac app (drag it to Applications), then launch Docker Desktop and leave it running. Confirm it works in Terminal:</p>
<pre><code class="language-bash">docker --version
docker compose version
docker run --rm hello-world</code></pre>
<p>A friendly hello message means you are set.</p>
<div class="box tip"><span class="h">Optional: Homebrew</span><p>Homebrew is a package manager for Mac that makes installing dev tools easy. It is not required for this book, but it is handy. The one line installer is at brew.sh, and later you could install tools like git with <code>brew install git</code> (newer Macs often already have git).</p></div>
<div class="box note"><span class="h">From here, you're with everyone else</span><p>The rest of the book's commands run the same in your Terminal as they do in Linux. When a lesson mentions WSL or PowerShell, that is a Windows thing, so ignore it. Wherever you see a path like <code>~/Dev</code>, that works for you too.</p></div>
<div class="box try"><span class="h"></span><p>Run <code>docker run --rm hello-world</code>, make your project folder with <code>mkdir -p ~/Dev &amp;&amp; cd ~/Dev</code>, then continue to <a onclick="go('p0-6')" style="cursor:pointer">Installing Docker</a> for the core concepts. Docker is already installed, so skip the Windows-only steps there.</p></div>
</div></template>

<template data-id="p0-5"><div class="content">
<p>WSL2 on Windows, or Terminal on a Mac, covers almost everyone. A few setups are different, so here are the alternatives with a straight take on each. If one is yours, skim it and meet everyone back at the Docker lesson.</p>
<h2>Windows without WSL2</h2>
<p>A small number of machines can't run WSL2, usually because virtualization is turned off in the BIOS or the hardware is fairly old. First, try turning on virtualization in your BIOS settings, since that often fixes it. If it still won't work, there is another option: install <strong>Docker Desktop for Windows</strong> and let it use its <strong>Hyper-V</strong> backend instead of WSL2.</p>
<p>The trade-off is real: this is the less optimized path. You give up the nice Linux environment and some speed, and a few commands in this book that assume Linux need small tweaks. It works, it is just not as smooth. If this is you, install Docker Desktop, then continue to the Docker lesson and use Windows PowerShell wherever the book shows a Linux shell.</p>
<h2>Raspberry Pi or a small home server</h2>
<p>A Raspberry Pi (a tiny, cheap computer) can run Docker and a Minecraft server. It is a great way to learn self hosting on hardware you can hold in your hand.</p>
<p>The catch is performance. A Pi will happily run the tools and a small server, but Minecraft is heavy, so a big, busy world will not feel smooth. For one or two people poking around and learning, it is fine. Use a Raspberry Pi 4 or 5 with as much memory as you can get.</p>
<div class="box note"><span class="h">It's the same book either way</span><p>On a Pi you are already on Linux, so you install Docker for your Pi's operating system and then follow along normally. Everything in Parts 1 to 3 is identical. Only the speed of your server changes.</p></div>
<div class="box warn"><span class="h">Recommendation</span><p>If you have a normal Windows PC or a Mac, use that as your default and treat a Pi as a fun second project later. Start where it is easiest, then branch out once you know the ropes.</p></div>
<div class="box try"><span class="h"></span><p>If one of these paths is yours, get Docker installed for your setup, then jump to <a onclick="go('p0-6')" style="cursor:pointer">Installing Docker</a> for the shared concepts and keep going from there.</p></div>
</div></template>

<template data-id="p0-3"><div class="content">
<p>This is the main path, and the one the rest of the book assumes. You'll install WSL2, a full Linux system that lives inside your Windows machine. It takes about ten minutes, and most of that is waiting.</p>
<h2>1. Install WSL2</h2>
<p>Open the Start menu, type <strong>PowerShell</strong>, right click it, and choose <strong>Run as administrator</strong>. In that window, run:</p>
<pre><code class="language-powershell">wsl --install</code></pre>
<p>That one command turns on the Windows features you need, installs Ubuntu (a friendly, popular flavor of Linux), and sets WSL2 as the default. When it asks you to reboot, do it.</p>
<div class="box warn"><span class="h">If that command isn't found</span><p>On older Windows builds <code>wsl --install</code> might not exist. Update Windows first (Settings, then Windows Update), then try again. You want Windows 10 version 2004 or newer, or any Windows 11.</p></div>
<h2>2. First launch</h2>
<p>After the reboot, Ubuntu finishes setting itself up and asks you to create a <strong>username</strong> and <strong>password</strong>. These are just for Linux and are separate from your Windows login. Pick something you will remember, because you will type that password whenever you run a command as admin (you'll see <code>sudo</code> for that).</p>
<h2>3. Confirm it worked</h2>
<p>Open Ubuntu any time from the Start menu, and run a few checks:</p>
<pre><code class="language-bash"><span class="c"># from PowerShell, confirm you're on version 2</span>
wsl -l -v
<span class="c"># inside Ubuntu, see who and where you are</span>
whoami
uname -a</code></pre>
<h2>4. Update your system</h2>
<p>Linux installs software through a package manager. Freshen everything once:</p>
<pre><code class="language-bash">sudo apt update &amp;&amp; sudo apt upgrade -y</code></pre>
<div class="box tip"><span class="h">The habit that really matters: where files live</span><p>Your Linux home is <code>/home/&lt;you&gt;</code>. Your Windows C: drive shows up at <code>/mnt/c</code>. Keep your projects on the Linux side (use <code>~/Dev</code>). Working out of <code>/mnt/c</code> is much slower and Docker likes it less. This single habit saves a lot of frustration later.</p></div>
<div class="box try"><span class="h"></span><p>Open Ubuntu, run the update command, then make your workshop folder with <code>mkdir -p ~/Dev &amp;&amp; cd ~/Dev</code>. That is where everything in this book will live. Then skip ahead to <a onclick="go('p0-6')" style="cursor:pointer">Installing Docker</a>. You can ignore the Mac and other-paths lessons.</p></div>
</div></template>

<template data-id="p0-6"><div class="content">
<p><strong>Docker</strong> packages software and everything it needs into a <em>container</em>, a sealed box that runs the same on your machine, your friend's, or a cloud server. Your Minecraft server runs in a container, which is why you never had to manually install Java or the Fabric launcher.</p>
<p>How you install Docker depends on your platform. Pick your line, do the install, then everyone meets back at <strong>Image vs. container</strong> below.</p>
<div class="box note"><span class="h">Already installed Docker?</span><p>The Mac path and the Raspberry Pi path both installed Docker back in their setup lessons. If that's you, skip straight to <strong>Image vs. container</strong> below. The install steps here are for the Windows + WSL2 path.</p></div>
<h2>Install Docker on Windows + WSL2</h2>
<ol>
<li>Download <strong>Docker Desktop for Windows</strong> from <a href="https://docs.docker.com/desktop/install/windows-install/" target="_blank" rel="noopener">docs.docker.com</a>.</li>
<li>During install, keep <strong>"Use WSL 2 based engine"</strong> checked.</li>
<li>After install: Docker Desktop → <strong>Settings → Resources → WSL Integration</strong> → enable your Ubuntu distro.</li>
</ol>
<p>Now Docker commands work <em>inside</em> WSL. Verify from Ubuntu (on a Mac or Pi, run the same checks in your terminal):</p>
<pre><code class="language-bash">docker --version
docker compose version
docker run --rm hello-world</code></pre>
<p>That last line pulls a tiny image and runs it. If you see a "Hello from Docker!" message, your whole toolchain is alive.</p>
<div class="box note"><span class="h">Image vs. container</span><p>An <strong>image</strong> is the blueprint (read-only, e.g. <code>itzg/minecraft-server</code>). A <strong>container</strong> is a running instance of that blueprint. You can start many containers from one image.</p></div>
<div class="box warn"><span class="h">The engine has to be running</span><p>If <code>docker</code> commands hang or report they can't connect, the engine isn't up. On Windows and Mac that means the Docker Desktop app needs to be open; on Linux or a Raspberry Pi it means starting the service with <code>sudo systemctl start docker</code>.</p></div>
<div class="box try"><span class="h"></span><p>Run <code>docker run --rm hello-world</code>, then <code>docker ps -a</code> to see the stopped container, then <code>docker image ls</code> to see the downloaded image.</p></div>
</div></template>

<template data-id="p0-7"><div class="content">
<p>Typing long <code>docker run</code> commands by hand is error-prone. <strong>Docker Compose</strong> lets you describe your services in a single <code>compose.yml</code> file and bring the whole stack up with one command. This is exactly how your Minecraft server is defined.</p>
<h2>Anatomy of a compose file</h2>
<pre><code class="language-yaml"><span class="k">services</span>:
  <span class="f">myservice</span>:
    <span class="k">image</span>: <span class="s">some/image:tag</span>   <span class="c"># which blueprint</span>
    <span class="k">ports</span>:
      - <span class="s">"8080:80"</span>          <span class="c"># host:container</span>
    <span class="k">environment</span>:
      <span class="f">KEY</span>: <span class="s">"value"</span>          <span class="c"># config passed in</span>
    <span class="k">volumes</span>:
      - <span class="s">./data:/data</span>        <span class="c"># persist files on the host</span>
    <span class="k">restart</span>: <span class="s">unless-stopped</span></code></pre>
<h3>Reading the two lines that trip everyone up</h3>
<p>Both <code>ports</code> and <code>volumes</code> use the same shape: <code>outside:inside</code>. The part <em>before</em> the colon is on your computer (the <strong>host</strong>); the part <em>after</em> is <strong>inside the container</strong>. A container is a sealed box, so anything that has to cross the wall, a network port or a folder, gets bridged across with that colon.</p>
<ul>
<li><code>"8080:80"</code> under <code>ports</code>: traffic hitting port <strong>8080 on your machine</strong> is forwarded to port <strong>80 inside the container</strong>. The program inside only listens on 80 and has no idea about 8080; that outside number is just the door you knock on. The two can match (<code>"80:80"</code>) or differ. This is the whole idea of port mapping: an external port wired to an internal one.</li>
<li><code>./data:/data</code> under <code>volumes</code>: the folder <strong><code>./data</code> on your machine</strong> is mounted as <strong><code>/data</code> inside the container</strong>. The <code>./</code> means "right here, in the same folder as the <code>compose.yml</code>", and <code>/data</code> is an absolute path in the container's own filesystem. The two names don't have to match; this example just reuses <code>data</code> on both sides. Anything the container writes to <code>/data</code> actually lands in <code>./data</code> on your disk, which is how it survives the container being thrown away.</li>
</ul>
<div class="box note"><span class="h">The official docs</span><p>This is the short version. The full Compose file reference, every key you can use, lives at <a href="https://docs.docker.com/compose/" target="_blank" rel="noopener">docs.docker.com/compose</a>. Keep it bookmarked; it's the source of truth.</p></div>
<h2>The four commands you'll use constantly</h2>
<pre><code class="language-bash">docker compose up -d        <span class="c"># start everything in the background</span>
docker compose ps           <span class="c"># what's running?</span>
docker compose logs -f      <span class="c"># follow the logs live (Ctrl+C to stop)</span>
docker compose down         <span class="c"># stop and remove the containers</span></code></pre>
<div class="box tip"><span class="h">Volumes are your save game</span><p>Containers are disposable; <strong>volumes</strong> are not. The <code>./minecraft-data:/data</code> line is why your world survives a <code>down</code>/<code>up</code> cycle. Delete the container, fine. Delete the volume folder, you lose the world.</p></div>
<div class="box try"><span class="h"></span><p>Practice the cycle on something throwaway before building the real server next lesson. Make a scratch folder, write a tiny compose file, and run it through:</p>
<pre style="margin:8px 0"><code class="language-bash">mkdir -p ~/Dev/compose-test &amp;&amp; cd ~/Dev/compose-test
printf 'services:\n  hello:\n    image: hashicorp/http-echo\n    command: ["-text=it works"]\n    ports:\n      - "5678:5678"\n' &gt; compose.yml
docker compose up -d
docker compose ps
curl localhost:5678        <span class="c"># -> it works (port 5678 outside reaches 5678 inside)</span>
docker compose down</code></pre></div>
</div></template>

<template data-id="p0-8"><div class="content">
<p>First, why Fabric at all? Plain "vanilla" Minecraft is the game exactly as Mojang ships it, with no way to load mods. <strong>Fabric</strong> is a lightweight mod loader: the server boots the loader first, and the loader then runs any mods you drop in, while leaving normal gameplay untouched for anyone who just wants vanilla. That's the whole reason this book runs Fabric. Part 2 is about writing your own mods, and a mod needs a loader to run inside. The <code>itzg/minecraft-server</code> image wires all of that up the moment you set <code>TYPE: "FABRIC"</code>.</p>
<p>Time to build the real server from nothing. First give it a home and move in:</p>
<pre><code class="language-bash">mkdir -p ~/Games/Minecraft/fabric-minecraft-server
cd ~/Games/Minecraft/fabric-minecraft-server</code></pre>
<p>That folder is the whole project: the <code>compose.yml</code> you're about to write, plus a <code>minecraft-data/</code> directory Docker will create for the world and mods. The path can be anything you like; this is just the one the rest of the book refers to.</p>
<p>Now make a file called <code>compose.yml</code> in that folder (<code>code compose.yml</code> opens it in VS Code) and paste in the stack below. Read it line by line so it's not magic:</p>
<pre><code class="language-yaml"><span class="k">services</span>:
  <span class="f">minecraft-fabric</span>:
    <span class="k">image</span>: <span class="s">itzg/minecraft-server</span>
    <span class="k">container_name</span>: <span class="s">minecraft-fabric</span>
    <span class="k">ports</span>:
      - <span class="s">"25565:25565"</span>     <span class="c"># the game port players connect to</span>
      - <span class="s">"25575:25575"</span>     <span class="c"># RCON: remote console (we'll use this from Python!)</span>
    <span class="k">environment</span>:
      <span class="f">EULA</span>: <span class="s">"TRUE"</span>
      <span class="f">TYPE</span>: <span class="s">"FABRIC"</span>        <span class="c"># mod loader</span>
      <span class="f">VERSION</span>: <span class="s">"1.21.11"</span>    <span class="c"># pinned so mappings match your mods</span>
      <span class="f">MEMORY</span>: <span class="s">"2G"</span>         <span class="c"># RAM allocated to this server container</span>
      <span class="f">ENABLE_RCON</span>: <span class="s">"TRUE"</span>
      <span class="f">RCON_PASSWORD</span>: <span class="s">"..."</span>
    <span class="k">volumes</span>:
      - <span class="s">./minecraft-data:/data</span>   <span class="c"># world, mods, configs live here</span>
    <span class="k">restart</span>: <span class="s">unless-stopped</span></code></pre>
<p>Set <code>RCON_PASSWORD</code> to something only you know (you'll need it again in Part 1), save the file, then start the server:</p>
<pre><code class="language-bash">docker compose up -d        <span class="c"># pull the image and boot the server in the background</span>
docker compose logs -f      <span class="c"># watch it build the world (Ctrl+C stops watching, not the server)</span></code></pre>
<p>The first run takes a minute or two: it downloads the image, accepts the EULA, fetches Fabric, and generates a fresh world into <code>minecraft-data/</code>. When the log prints <code>Done</code>, the server is live. Open Minecraft (Java Edition, version 1.21.11), add a server pointing at <code>localhost</code>, and join your own world.</p>
<h2>The mental model</h2>
<ul>
<li><strong>Mods</strong> go in <code>minecraft-data/mods/</code>, that maps to <code>/data/mods</code> inside the container.</li>
<li><strong>RCON</strong> (port 25575) is a remote console: send console commands over the network. Your Python scripts and web dashboard will drive the server through it.</li>
<li><strong>VERSION pinned to 1.21.11</strong> matters: a Fabric mod must be built against the exact MC version the server runs.</li>
</ul>
<h2>Send your first remote command</h2>
<pre><code class="language-bash"><span class="c"># the itzg image ships an rcon client</span>
docker exec minecraft-fabric rcon-cli time set day
docker exec minecraft-fabric rcon-cli list</code></pre>
<div class="box try"><span class="h"></span><p>Run <code>docker exec minecraft-fabric rcon-cli "say Hello from the console"</code>. If a player is online they'll see it. You just controlled the game without touching the game.</p></div>
</div></template>

<template data-id="p0-9"><div class="content">
<p>A few tools will make everything smoother. Install them once.</p>
<h2>VS Code + the WSL extension</h2>
<p>Install <strong>VS Code</strong>. On Windows, also add the <strong>WSL</strong> extension so the editor can reach into Ubuntu (on a Mac it just opens local folders directly). Now open the server project you built last lesson:</p>
<pre><code class="language-bash">cd ~/Games/Minecraft/fabric-minecraft-server
code .</code></pre>
<p>On Windows the editor opens <em>connected to Linux</em>, editing Linux files with a Windows UI. Best of both worlds. Also grab the <strong>Python</strong> and <strong>Docker</strong> extensions.</p>
<h2>Git: your time machine</h2>
<pre><code class="language-bash">sudo apt install -y git
git config --global user.name  "Your Name"
git config --global user.email "you@example.com"</code></pre>
<p>Git records snapshots of your code so you can experiment fearlessly and undo mistakes. Every project in this book is a git repo.</p>
<pre><code class="language-bash">mkdir -p ~/Dev/myproject &amp;&amp; cd ~/Dev/myproject
git init
git add -A
git commit -m "first commit"</code></pre>
<div class="box tip"><span class="h">The terminal is home</span><p>Get comfortable with <code>cd</code> (change dir), <code>ls -la</code> (list), <code>cat file</code> (print), <code>mkdir</code>, <code>mv</code>, <code>rm</code>, and <kbd>Tab</kbd> to autocomplete paths. You'll use them every single day.</p></div>
<div class="box try"><span class="h"></span><p>Run <code>code .</code> inside <code>~/Dev</code>, open a terminal in VS Code (<kbd>Ctrl</kbd>+<kbd>`</kbd>), and confirm it says you're in Linux. You're now fully equipped.</p></div>
</div></template>

<!-- ===== PART 1: PYTHON ===== -->
<template data-id="p1-1"><div class="content">
<p>Python is a great first language. The code reads almost like English, it comes with plenty built in, and it runs everywhere: websites, scripts, data work, and talking to a Minecraft server. This lesson gets you running Python two different ways and writing your first program. No experience assumed. If a step is new, that is fine, just follow along and type the commands yourself.</p>

<h2>Open a terminal</h2>
<p>Everything here happens in a terminal, the text window from Part 0. On Windows that is your Ubuntu (WSL) window. On a Mac it is the Terminal app. If you skipped the setup, go back to <a onclick="go('p0-2')" style="cursor:pointer">Pick your path</a> and do your platform first.</p>
<p>Python comes preinstalled on Ubuntu and macOS. Check that it is there:</p>
<pre><code class="language-bash">python3 --version</code></pre>
<p>You should see something like <code>Python 3.12.3</code>. The exact numbers do not matter as long as it starts with a 3. If Linux says "command not found," install it:</p>
<pre><code class="language-bash">sudo apt install -y python3</code></pre>
<div class="box warn"><span class="h">python vs python3</span><p>On many systems, plain <code>python</code> is missing or points at an ancient version. Type <code>python3</code> everywhere in this book and you will skip a very common beginner headache.</p></div>

<h2>The REPL: talk to Python live</h2>
<p>The quickest way to try Python is the REPL, an interactive prompt where you type one line and Python answers immediately. Start it:</p>
<pre><code class="language-bash">python3</code></pre>
<p>The prompt changes to <code>&gt;&gt;&gt;</code>, which means Python is listening. Type each line below and press enter after it. The lines without <code>&gt;&gt;&gt;</code> are what Python prints back:</p>
<pre><code class="language-python">&gt;&gt;&gt; <span class="n">2</span> + <span class="n">2</span>
<span class="n">4</span>
&gt;&gt;&gt; <span class="f">print</span>(<span class="s">"hello, world"</span>)
hello, world
&gt;&gt;&gt; <span class="f">len</span>(<span class="s">"creeper"</span>)
<span class="n">7</span></code></pre>
<p>Three things just happened:</p>
<ul>
<li><code>2 + 2</code> is plain math, and the REPL shows the result, <code>4</code>.</li>
<li><code>print(...)</code> is a <strong>function</strong>, a built-in command that does something. This one shows whatever you put inside the parentheses. The text inside quotes is a <strong>string</strong>, which just means a piece of text.</li>
<li><code>len(...)</code> is another function. It counts the characters in a string. The word "creeper" has 7 letters.</li>
</ul>
<p>To leave the REPL, press <kbd>Ctrl</kbd>+<kbd>D</kbd>, or type <code>exit()</code> and press enter. Reach for the REPL any time you want to test a small idea.</p>
<div class="box tip"><span class="h">Errors are friendly, read them</span><p>If you type something Python does not understand, it prints a message that ends with the problem, like <code>SyntaxError</code>. That is not a scolding, it is a hint about what to fix. Try <code>print("oops)</code> with a missing closing quote, read what it says, then fix it and run again.</p></div>

<h2>Your first real program: a script</h2>
<p>The REPL forgets everything once you close it. To keep a program, save it in a file (a <strong>script</strong>) and run that file. Open your projects folder in VS Code:</p>
<pre><code class="language-bash">cd ~/Dev
code .</code></pre>
<p>Make a new file named <code>hello.py</code> (the <code>.py</code> ending marks it as Python) and type this in:</p>
<pre><code class="language-python"><span class="k">def</span> <span class="f">greet</span>(name):
    <span class="k">return</span> <span class="s">f"Welcome to the server, {name}!"</span>

<span class="k">print</span>(<span class="f">greet</span>(<span class="s">"Steve"</span>))</code></pre>
<p>Reading it line by line:</p>
<ul>
<li><code>def greet(name):</code> creates your own function named <code>greet</code> that accepts one input, here called <code>name</code>.</li>
<li>The indented line below it (four spaces) is the body of the function. Python uses that indentation to know which lines belong inside. <code>return</code> hands a value back to whoever called the function.</li>
<li><code>f"..."</code> is an <strong>f-string</strong>. Anything inside the curly braces gets filled in, so <code>{name}</code> turns into the name you passed. The next lesson covers these properly.</li>
<li>The last line calls <code>greet</code> with <code>"Steve"</code> and prints the result.</li>
</ul>
<p>Save the file, then run it from the terminal:</p>
<pre><code class="language-bash">python3 hello.py</code></pre>
<p>Output:</p>
<pre><code class="language-text">Welcome to the server, Steve!</code></pre>
<div class="box warn"><span class="h">If it says "can't open file"</span><p>Python looks in the folder your terminal is currently in. Run <code>ls</code> to list the files there. If you do not see <code>hello.py</code>, use <code>cd</code> to move into the folder that has it, then run the command again.</p></div>

<div class="box tip"><span class="h">Bonus: you already have a web server</span><p>Run <code>python3 -m http.server 8000</code> in any folder, then open <code>http://localhost:8000</code> in a browser. Python just served files over HTTP, a small preview of Part 3. Press <kbd>Ctrl</kbd>+<kbd>C</kbd> to stop it.</p></div>

<template data-id="p1-2"><div class="content">
<p>Programs need to remember things: a player's name, how much health they have, where they are standing. You store those with <strong>variables</strong>. This lesson covers variables, the basic kinds of values Python has, and the two you will use most, text and numbers.</p>

<h2>Variables: names for values</h2>
<p>A variable is a name that points at a value. You create one with a single <code>=</code>, which means "store the value on the right under the name on the left."</p>
<pre><code class="language-python">name    = <span class="s">"Alex"</span>        <span class="c"># text (a string)</span>
health  = <span class="n">20</span>            <span class="c"># a whole number (an int)</span>
speed   = <span class="n">6.7</span>           <span class="c"># a number with a decimal (a float)</span>
is_op   = <span class="k">True</span>          <span class="c"># True or False (a bool)</span>
nothing = <span class="k">None</span>          <span class="c"># "no value yet" (None)</span></code></pre>
<p>After this, typing <code>health</code> gives you <code>20</code>. You did not tell Python which kind of value each one is. It figures that out from what you assigned. Those five kinds (<strong>str</strong>, <strong>int</strong>, <strong>float</strong>, <strong>bool</strong>, <strong>None</strong>) cover most of what you will start with.</p>
<p>Variables can change. Assign again and the name points at the new value:</p>
<pre><code class="language-python">health = <span class="n">20</span>
health = health <span class="o">-</span> <span class="n">5</span>     <span class="c"># now 15</span>
<span class="k">print</span>(health)         <span class="c"># 15</span></code></pre>
<div class="box tip"><span class="h">Naming rules</span><p>Use lowercase words joined by underscores, like <code>player_name</code>. Names can contain letters, numbers, and underscores, but cannot start with a number. Names are case sensitive, so <code>Health</code> and <code>health</code> are different. Pick clear names. <code>health</code> beats <code>h</code> every time.</p></div>

<h2>Text: strings</h2>
<p>A string is text wrapped in quotes. Single or double quotes both work, just be consistent. You can join strings, repeat them, and measure them:</p>
<pre><code class="language-python">first = <span class="s">"Steve"</span>
greeting = <span class="s">"hi "</span> + first      <span class="c"># "hi Steve"  (joining is called concatenation)</span>
line = <span class="s">"="</span> * <span class="n">10</span>             <span class="c"># "==========" (repeat 10 times)</span>
<span class="k">print</span>(<span class="f">len</span>(first))           <span class="c"># 5</span></code></pre>
<p>Strings come with handy built-in actions called <strong>methods</strong>, which you call with a dot:</p>
<pre><code class="language-python">player = <span class="s">"notch"</span>
<span class="k">print</span>(player.<span class="f">upper</span>())          <span class="c"># NOTCH</span>
<span class="k">print</span>(player.<span class="f">capitalize</span>())     <span class="c"># Notch</span>
<span class="k">print</span>(<span class="s">"creep"</span> <span class="k">in</span> <span class="s">"creeper"</span>)    <span class="c"># True  (is one inside the other?)</span></code></pre>
<h3>f-strings: the clean way to build text</h3>
<p>Putting an <code>f</code> right before the opening quote lets you drop values straight into the text using curly braces. This is the way you will format almost everything:</p>
<pre><code class="language-python">player = <span class="s">"notch"</span>
coords = (<span class="n">100</span>, <span class="n">64</span>, <span class="o">-</span><span class="n">200</span>)
<span class="k">print</span>(<span class="s">f"Teleporting {player} to {coords}"</span>)
<span class="c"># Teleporting notch to (100, 64, -200)</span></code></pre>
<p>You can even put math inside the braces: <code>f"Half health is {health / 2}"</code>.</p>

<h2>Numbers: int and float</h2>
<p>Whole numbers are <strong>int</strong>, numbers with a decimal point are <strong>float</strong>. The usual math works, plus a few that are very handy in games:</p>
<pre><code class="language-python">ticks = <span class="n">24000</span>
seconds = ticks / <span class="n">20</span>            <span class="c"># 1200.0   normal division, always a float</span>
whole   = ticks // <span class="n">20</span>           <span class="c"># 1200     floor division, drops the decimal</span>
left    = <span class="n">7</span> % <span class="n">3</span>                <span class="c"># 1        remainder (modulo)</span>
power   = <span class="n">2</span> ** <span class="n">10</span>              <span class="c"># 1024     2 to the 10th</span></code></pre>
<p><code>%</code> (modulo) gives the remainder, which is perfect for "every Nth time" checks later. <code>//</code> throws away the fractional part.</p>

<h2>Converting between text and numbers</h2>
<p>This trips up every beginner once, so here it is up front. A number typed by a user arrives as <em>text</em>, and Python will not add text to a number:</p>
<pre><code class="language-python">age = <span class="s">"12"</span>            <span class="c"># this is text, not a number</span>
age + <span class="n">1</span>               <span class="c"># TypeError: can only concatenate str to str</span></code></pre>
<p>Convert first with <code>int(...)</code>, <code>float(...)</code>, or <code>str(...)</code>:</p>
<pre><code class="language-python">age = <span class="f">int</span>(<span class="s">"12"</span>)        <span class="c"># the number 12</span>
<span class="k">print</span>(age + <span class="n">1</span>)         <span class="c"># 13</span>
label = <span class="s">"HP: "</span> + <span class="f">str</span>(<span class="n">20</span>)  <span class="c"># "HP: 20"  (number turned into text)</span></code></pre>
