<li><strong>React + TypeScript</strong> — the dominant frontend stack.</li>
<li><strong>A backend framework</strong> in depth — FastAPI or Node/Express.</li>
<li><strong>Databases &amp; SQL</strong> — schema design, indexes, migrations.</li>
<li><strong>Testing</strong> — pytest, automated checks, CI with GitHub Actions.</li>
<li><strong>Cloud &amp; deployment</strong> — Docker (✓), a VM, DNS, HTTPS, logging.</li>
</ol>
<div class="box tip"><span class="h">The meta-skill</span><p>You already practiced the thing senior engineers do that juniors don't: <strong>verify against the source of truth</strong> (you decompiled jars instead of trusting tutorials). Apply that everywhere — read the docs, read the code, test your assumptions.</p></div>
<div class="box note"><span class="h">Build in public</span><p>Push every project to GitHub with a clear README. Your Minecraft dashboard, your two mods, your scripts — that's a portfolio that tells a story. Employers hire the story.</p></div>
<div class="box try"><span class="h">Final quest</span><p>Pick one capstone upgrade above and ship it this week. Then write a README explaining what it does and how to run it. You're not "learning to code" anymore — you're building.</p></div>
</div></template>

<script>
// ----------------- curriculum manifest -----------------
const PARTS = [
  { id:"0", title:"Launchpad", sub:"WSL · Docker · your server · your tools", lessons:[
    ["p0-1","How this book works"],
    ["p0-2","WSL2: Linux on Windows"],
    ["p0-3","Installing Docker"],
    ["p0-4","Docker Compose fundamentals"],
    ["p0-5","Your Fabric 1.21.11 server, line by line"],
    ["p0-6","Dev toolkit: VS Code, Git, terminal"],
  ]},
  { id:"1", title:"Python", sub:"from print() to classes & generators", lessons:[
    ["p1-1","Hello, Python"],
    ["p1-2","Variables, types & strings"],
    ["p1-3","Control flow: if & loops"],
    ["p1-4","Lists, dicts, sets & tuples"],
    ["p1-5","Functions"],
    ["p1-6","Files, JSON & errors"],
    ["p1-7","Modules, pip & virtualenvs"],
    ["p1-8","Classes & objects (OOP)"],
    ["p1-9","Comprehensions, generators, typing"],
    ["p1-10","Talk to your server with RCON"],
  ]},
  { id:"2", title:"Minecraft", sub:"Fabric mods, events, commands, mixins", lessons:[
    ["p2-1","How Minecraft modding works"],
    ["p2-2","Project anatomy"],
    ["p2-3","Your first server mod"],
    ["p2-4","Events & the tick loop"],
    ["p2-5","Game rules & commands"],
    ["p2-6","Client mods & keybinds"],
    ["p2-7","Mixins (advanced)"],
    ["p2-8","Reading the mapped jar"],
  ]},
  { id:"3", title:"Full-Stack", sub:"HTTP · FastAPI · a live web dashboard", lessons:[
    ["p3-1","The web & how full-stack fits"],
    ["p3-2","HTML & CSS foundations"],
    ["p3-3","JavaScript in the browser"],
    ["p3-4","A backend API with FastAPI"],
    ["p3-5","Wire the API to Minecraft (RCON)"],
    ["p3-6","A live frontend dashboard"],
    ["p3-7","Databases: SQLite → Postgres"],
    ["p3-8","Deploy with Docker Compose"],
    ["p3-9","Capstone & full-stack roadmap"],
  ]},
];

// flat ordered list of lesson ids
const ORDER = [];
const META = {};   // id -> {title, partId, partTitle, idx}
PARTS.forEach(p => p.lessons.forEach(([id,title]) => {
  META[id] = { title, partId:p.id, partTitle:p.title };
  ORDER.push(id);
}));
const TOTAL = ORDER.length;

// ----------------- progress (localStorage) -----------------
const KEY = "bxb-progress-v1";
let done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
function saveProgress(){ localStorage.setItem(KEY, JSON.stringify([...done])); }

// ----------------- build the sidebar -----------------
const toc = document.getElementById("toc");
function buildToc(){
  toc.innerHTML = "";
  PARTS.forEach(p => {
    const part = document.createElement("div"); part.className = "part";
    const head = document.createElement("div"); head.className = "phead";
    head.innerHTML = `<span class="pnum">${p.id}</span><span class="ptitle">${p.title}<br><span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint);font-size:11px">${p.sub}</span></span>`;
    const box = document.createElement("div"); box.className = "lessons";
    p.lessons.forEach(([id,title]) => {
      const lk = document.createElement("div");
      lk.className = "lk" + (done.has(id)?" done":"");
      lk.dataset.id = id;
      lk.innerHTML = `<span class="tick"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0c0f13" stroke-width="4"><path d="M20 6 9 17l-5-5"/></svg></span><span class="lbl">${title}</span>`;
      lk.onclick = () => { go(id); if(window.innerWidth<=900) toc.classList.remove("open"); };
      box.appendChild(lk);
    });
    head.onclick = () => box.style.maxHeight = box.style.maxHeight ? "" : box.scrollHeight+"px";
    part.appendChild(head); part.appendChild(box);
    toc.appendChild(part);
  });
}

// ----------------- render a view -----------------
const view = document.getElementById("view");
let current = null;

function renderCover(){
  current = "cover";
  const pct = Math.round(done.size/TOTAL*100);
  view.innerHTML = `
  <div class="cover">
    <div class="kick">A hands-on field guide</div>
    <h1>Block by Block<em>Python → Mods → Full-Stack</em></h1>
    <p class="sub">Go from your first <code>print()</code> to a live web dashboard wired into a Minecraft server you host yourself. Three disciplines, one throughline.</p>
    <div class="meta">
      <span>🧩 <b>${TOTAL}</b> lessons</span>
      <span>🐍 Python</span>
      <span>⛏ Fabric 1.21.11</span>
      <span>🌐 FastAPI + JS</span>
      <span>🐳 Docker / WSL</span>
      <span>📈 <b>${pct}%</b> complete</span>
    </div>
    <button class="begin" onclick="go(resumeId())">${done.size? "Resume where you left off ▸":"Begin · Part 0 ▸"}</button>
    <div class="parts-grid">
      ${PARTS.map(p=>`<div class="pcard" onclick="go('${p.lessons[0][0]}')">
        <div class="pn">${p.id}</div><h3>${p.title}</h3><p>${p.sub}</p>
        <span class="cnt">${p.lessons.length} lessons →</span></div>`).join("")}
    </div>
  </div>`;
  setActive(null); updateXP(); window.scrollTo(0,0);
}

function go(id){
  if(id==="cover"){ location.hash=""; renderCover(); return; }
  location.hash = id;
}

function render(id){
  const m = META[id];
  if(!m){ renderCover(); return; }
  current = id;
  const tpl = document.querySelector(`template[data-id="${id}"]`);
  const body = tpl ? tpl.innerHTML : "<div class='content'><p>Coming soon.</p></div>";
  const idx = ORDER.indexOf(id);
  const prev = idx>0 ? ORDER[idx-1] : null;
  const next = idx<TOTAL-1 ? ORDER[idx+1] : null;
  const isDone = done.has(id);
  view.innerHTML = `
    <div class="wrap">
      <div class="crumb">Part ${m.partId} · ${m.partTitle}<span class="dot"></span>Lesson ${idx+1} / ${TOTAL}</div>
      <h1 class="title">${m.title}</h1>
      ${body}
      <button class="markbtn ${isDone?'done':''}" onclick="toggleDone('${id}')">
        ${isDone? '✓ Completed — click to undo' : 'Mark complete  ⛏'}
      </button>
      <div class="pager">
        ${prev?`<a onclick="go('${prev}')"><div class="dir">◀ Previous</div><div class="nm">${META[prev].title}</div></a>`:`<a style="opacity:.3;cursor:default"><div class="dir">Start</div><div class="nm">Cover</div></a>`}
        ${next?`<a class="nx" onclick="go('${next}')"><div class="dir">Next ▶</div><div class="nm">${META[next].title}</div></a>`:`<a class="nx" onclick="go('cover')"><div class="dir">Finish ▶</div><div class="nm">Back to cover</div></a>`}
      </div>
    </div>`;
  addCopyButtons();
  setActive(id);
  updateXP();
  window.scrollTo(0,0);
}

// ----------------- helpers -----------------
function setActive(id){
  document.querySelectorAll(".lk").forEach(l=>l.classList.toggle("active", l.dataset.id===id));
  if(id){
    const lk = document.querySelector(`.lk[data-id="${id}"]`);
    if(lk){ const box = lk.closest(".lessons"); if(box) box.style.maxHeight = box.scrollHeight+"px"; }
  }
}
function toggleDone(id){
  if(done.has(id)) done.delete(id); else done.add(id);
  saveProgress();
  document.querySelector(`.lk[data-id="${id}"]`)?.classList.toggle("done", done.has(id));
  if(current===id) render(id);
}
function resumeId(){
  for(const id of ORDER) if(!done.has(id)) return id;
  return ORDER[0];
}
function updateXP(){
  const n = done.size;
  document.getElementById("done").textContent = n;
  document.getElementById("total").textContent = TOTAL;
  document.getElementById("lvlnum").textContent = n;
  document.getElementById("fill").style.width = (n/TOTAL*100)+"%";
  // ring around level badge = progress toward the very end
  document.getElementById("ring").style.strokeDashoffset = 107 - (107*n/TOTAL);
}
function resetProgress(){
  if(confirm("Reset all progress? Your XP returns to zero.")){
    done = new Set(); saveProgress(); buildToc();
    current==="cover" ? renderCover() : render(current);
  }
}
function addCopyButtons(){
  document.querySelectorAll(".content pre").forEach(pre=>{
    const code = pre.querySelector("code");
    let lang = "code";
    (code.className.match(/language-(\w+)/)||[])[1] && (lang=(code.className.match(/language-(\w+)/))[1]);
    const bar = document.createElement("div"); bar.className="bar";
    bar.innerHTML = `<span class="dots"><i style="background:#e0573d"></i><i style="background:#f1c659"></i><i style="background:#5fcf80"></i></span><span class="lang">${lang}</span><button class="copy">copy</button>`;
    pre.prepend(bar);
    bar.querySelector(".copy").onclick = () => {
      navigator.clipboard.writeText(code.innerText);
      const b=bar.querySelector(".copy"); b.textContent="copied!"; setTimeout(()=>b.textContent="copy",1200);
    };
  });
}

// ----------------- routing & keys -----------------
function route(){
  const id = location.hash.replace("#","");
  id && META[id] ? render(id) : renderCover();
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  const idx = ORDER.indexOf(current);
  if(e.key==="ArrowRight" && idx>-1 && idx<TOTAL-1) go(ORDER[idx+1]);
  if(e.key==="ArrowLeft"){ if(idx>0) go(ORDER[idx-1]); else if(current!=="cover") go("cover"); }
  if(e.key.toLowerCase()==="c" && current && current!=="cover") toggleDone(current);
});

// ----------------- search -----------------
const q = document.getElementById("q"), qres = document.getElementById("qres");
q.addEventListener("input", ()=>{
  const term = q.value.toLowerCase().trim();
  if(!term){ qres.classList.remove("show"); return; }
  const hits = ORDER.filter(id=>META[id].title.toLowerCase().includes(term)
    || META[id].partTitle.toLowerCase().includes(term)).slice(0,8);
  qres.innerHTML = hits.length
    ? hits.map(id=>`<a onclick="go('${id}');document.getElementById('q').value='';document.getElementById('qres').classList.remove('show')"><span class="pt">Part ${META[id].partId} · ${META[id].partTitle}</span><br>${META[id].title}</a>`).join("")
    : `<a style="color:var(--faint)">no matches</a>`;
  qres.classList.add("show");
});
document.addEventListener("click", e=>{ if(!e.target.closest(".search")) qres.classList.remove("show"); });

// ----------------- boot -----------------
buildToc();
route();
</script>
</body>
</html>
