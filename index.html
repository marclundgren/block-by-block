}

function renderBonus(){
  current = "bonus";
  const tpl = document.querySelector('template[data-id="bonus"]');
  const last = ORDER[ORDER.length-1];
  view.innerHTML = `<div class="wrap">
    <div class="crumb" style="color:var(--gold)">★ Secret Chapter · unlocked</div>
    <h1 class="title">The AI Admin Console</h1>
    ${tpl ? tpl.innerHTML : "<div class='content'><p>Coming soon.</p></div>"}
    <div class="pager">
      <a onclick="go('${last}')"><div class="dir">◀ Last lesson</div><div class="nm">${META[last].title}</div></a>
      <a class="nx" onclick="go('cover')"><div class="dir">Home ▶</div><div class="nm">Back to cover</div></a>
    </div></div>`;
  addCopyButtons();
  document.querySelectorAll(".lk").forEach(l=>l.classList.remove("active"));
  document.querySelector(".bonus-link")?.classList.add("active");
  window.scrollTo(0,0);
}
function celebrateUnlock(){
  const t = document.createElement("div"); t.className = "unlock-toast";
  t.innerHTML = '★ Achievement unlocked: <b>Secret Chapter</b><br><span>The AI Admin Console is now at the top of the menu.</span><br><a onclick="go(\'bonus\');this.parentNode.remove()">Open it ▸</a>';
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{ t.classList.remove("show"); setTimeout(()=>t.remove(),400); }, 9000);
}
function go(id){
  if(id==="cover"){ location.hash=""; renderCover(); return; }
  location.hash = id;
}

function render(id){
  const m = META[id];
  if(!m){ renderCover(); return; }
  current = id;
  const tpl = document.querySelector(`template[data-id="${id}"]`);
  const body = tpl ? tpl.innerHTML : "<div class='content'><p>Coming soon.</p></div>";
  const idx = ORDER.indexOf(id);
  const prev = prevOf(id);
  const next = nextOf(id);
  const isDone = done.has(id);
  // a lesson with an unanswered quiz keeps "Mark complete" locked until it's solved
  const locked = !isDone && /class="quiz"/.test(body);
  view.innerHTML = `
    <div class="wrap">
      <div class="crumb">Part ${m.partId} · ${m.partTitle}<span class="dot"></span>Lesson ${idx+1} / ${TOTAL}</div>
      <h1 class="title">${m.title}</h1>
      ${body}
      <button class="markbtn ${isDone?'done':''}" ${locked?'disabled title="Answer the quiz to unlock"':''} onclick="toggleDone('${id}')">
        ${isDone? '✓ Completed, tap to undo' : (locked? 'Solve the quiz to unlock  🔒' : 'Mark complete  ⛏')}
      </button>
      <div class="pager">
        ${prev?`<a onclick="go('${prev}')"><div class="dir">◀ Previous</div><div class="nm">${META[prev].title}</div></a>`:`<a style="opacity:.3;cursor:default"><div class="dir">Start</div><div class="nm">Cover</div></a>`}
        ${next?`<a class="nx" onclick="go('${next}')"><div class="dir">Next ▶</div><div class="nm">${META[next].title}</div></a>`:`<a class="nx" onclick="go('cover')"><div class="dir">Finish ▶</div><div class="nm">Back to cover</div></a>`}
      </div>
    </div>`;
  addCopyButtons();
  setupQuiz();
  setActive(id);
  updateXP();
  window.scrollTo(0,0);
}

// wire up an in-lesson multiple-choice quiz, if the lesson has one.
// picking the correct option unlocks the "Mark complete" button.
function setupQuiz(){
  const quiz = document.querySelector(".content .quiz");
  if(!quiz) return;
  const answer = quiz.dataset.answer;
  const msg = quiz.querySelector(".quiz-msg");
  const btn = document.querySelector(".markbtn");
  quiz.querySelectorAll(".opt").forEach(opt => {
    opt.addEventListener("click", () => {
      const right = opt.dataset.val === answer;
      quiz.querySelectorAll(".opt").forEach(o => o.classList.remove("correct","wrong"));
      opt.classList.add(right ? "correct" : "wrong");
      if(right){
        quiz.classList.add("solved");
        msg.textContent = "Correct. You can mark this lesson complete.";
        msg.className = "quiz-msg ok";
        if(btn){ btn.disabled = false; btn.removeAttribute("title"); btn.innerHTML = "Mark complete  ⛏"; }
      } else {
        msg.textContent = "Not quite. Work the math again and try another option.";
        msg.className = "quiz-msg no";
      }
    });
  });
}

// ----------------- helpers -----------------
function setActive(id){
  document.querySelectorAll(".lk").forEach(l=>l.classList.toggle("active", l.dataset.id===id));
  if(id){
    const lk = document.querySelector(`.lk[data-id="${id}"]`);
    if(lk){ const box = lk.closest(".lessons"); if(box) box.style.maxHeight = box.scrollHeight+"px"; }
  }
}
function toggleDone(id){
  const wasUnlocked = allUnlocked();
  const nowDone = !done.has(id);
  if(nowDone) done.add(id); else done.delete(id);
  saveProgress();
  document.querySelector(`.lk[data-id="${id}"]`)?.classList.toggle("done", nowDone);
  // update the button in place instead of re-rendering, so we keep scroll position
  if(current===id){
    const btn = document.querySelector(".markbtn");
    if(btn){
      btn.classList.toggle("done", nowDone);
      btn.innerHTML = nowDone ? '✓ Completed, tap to undo' : 'Mark complete  ⛏';
    }
  }
  updateXP();
  // reveal or hide the secret chapter when crossing 100%
  const nowUnlocked = allUnlocked();
  if(nowUnlocked !== wasUnlocked){ buildToc(); setActive(current); }
  if(nowUnlocked && !wasUnlocked) celebrateUnlock();
}
function resumeId(){
  for(const id of ORDER){
    if(ALT.includes(id) && altPicked()) continue;  // once a platform is chosen, don't nag about the others
    if(!done.has(id)) return id;
  }
  return ORDER[0];
}
function updateXP(){
  const n = effDone();
  document.getElementById("done").textContent = n;
  document.getElementById("total").textContent = EFF_TOTAL;
  document.getElementById("lvlnum").textContent = n;
  document.getElementById("fill").style.width = (n/EFF_TOTAL*100)+"%";
  // ring around level badge = progress toward the very end
  document.getElementById("ring").style.strokeDashoffset = 107 - (107*n/EFF_TOTAL);
}
function resetProgress(){
  if(confirm("Reset all progress? Your XP returns to zero.")){
    done = new Set(); saveProgress(); buildToc();
    current==="cover" ? renderCover() : render(current);
  }
}
function addCopyButtons(){
  document.querySelectorAll(".content pre").forEach(pre=>{
    const code = pre.querySelector("code");
    let lang = "code";
    (code.className.match(/language-(\w+)/)||[])[1] && (lang=(code.className.match(/language-(\w+)/))[1]);
    const bar = document.createElement("div"); bar.className="bar";
    bar.innerHTML = `<span class="dots"><i style="background:#e0573d"></i><i style="background:#f1c659"></i><i style="background:#5fcf80"></i></span><span class="lang">${lang}</span><button class="copy">copy</button>`;
    pre.prepend(bar);
    bar.querySelector(".copy").onclick = () => {
      navigator.clipboard.writeText(code.innerText);
      const b=bar.querySelector(".copy"); b.textContent="copied!"; setTimeout(()=>b.textContent="copy",1200);
    };
  });
}

// ----------------- routing & keys -----------------
function route(){
  const id = location.hash.replace("#","");
  if(id==="bonus"){ allUnlocked() ? renderBonus() : renderCover(); return; }
  id && META[id] ? render(id) : renderCover();
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  const idx = ORDER.indexOf(current);
  if(e.key==="ArrowRight" && idx>-1){ const n = nextOf(current); if(n) go(n); }
  if(e.key==="ArrowLeft"){ const p = idx>-1 ? prevOf(current) : null; if(p) go(p); else if(current!=="cover") go("cover"); }
  if(e.key.toLowerCase()==="c" && current && current!=="cover"){
    const mb = document.querySelector(".markbtn");
    if(mb && mb.disabled) return;   // locked by an unsolved quiz
    toggleDone(current);
  }
});

// ----------------- search -----------------
const q = document.getElementById("q"), qres = document.getElementById("qres");
q.addEventListener("input", ()=>{
  const term = q.value.toLowerCase().trim();
  if(!term){ qres.classList.remove("show"); return; }
  const hits = ORDER.filter(id=>META[id].title.toLowerCase().includes(term)
    || META[id].partTitle.toLowerCase().includes(term)).slice(0,8);
  qres.innerHTML = hits.length
    ? hits.map(id=>`<a onclick="go('${id}');document.getElementById('q').value='';document.getElementById('qres').classList.remove('show')"><span class="pt">Part ${META[id].partId} · ${META[id].partTitle}</span><br>${META[id].title}</a>`).join("")
    : `<a style="color:var(--faint)">no matches</a>`;
  qres.classList.add("show");
});
document.addEventListener("click", e=>{ if(!e.target.closest(".search")) qres.classList.remove("show"); });

// ----------------- boot -----------------
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);localStorage.setItem("bxb-theme",t);}
function toggleTheme(){const cur=document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light";applyTheme(cur==="dark"?"light":"dark");}

buildToc();
route();
</script>
</body>
</html>
