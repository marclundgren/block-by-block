<template data-id="p1-3"><div class="content">
<p>Programs make decisions and repeat work. Python uses <strong>indentation</strong> (4 spaces) to define blocks, no curly braces.</p>
<h2>if / elif / else</h2>
<pre><code class="language-python">hp = <span class="n">20</span>
<span class="k">if</span> hp &lt;= <span class="n">0</span>:
    <span class="k">print</span>(<span class="s">"You died."</span>)
<span class="k">elif</span> hp &lt; <span class="n">8</span>:
    <span class="k">print</span>(<span class="s">"Low health, eat something!"</span>)
<span class="k">else</span>:
    <span class="k">print</span>(<span class="s">"You're fine."</span>)</code></pre>
<h2>Loops</h2>
<pre><code class="language-python"><span class="c"># repeat a fixed number of times</span>
<span class="k">for</span> i <span class="k">in</span> <span class="f">range</span>(<span class="n">3</span>):
    <span class="k">print</span>(<span class="s">f"Spawning wave {i+1}"</span>)

<span class="c"># loop over items</span>
mobs = [<span class="s">"zombie"</span>, <span class="s">"skeleton"</span>, <span class="s">"creeper"</span>]
<span class="k">for</span> mob <span class="k">in</span> mobs:
    <span class="k">print</span>(<span class="s">f"A {mob} approaches"</span>)

<span class="c"># loop until a condition changes</span>
fuel = <span class="n">5</span>
<span class="k">while</span> fuel &gt; <span class="n">0</span>:
    <span class="k">print</span>(<span class="s">f"Smelting... {fuel} fuel left"</span>)
    fuel <span class="o">-</span>= <span class="n">1</span></code></pre>
<div class="box note"><span class="h">break &amp; continue</span><p><code>break</code> exits a loop early; <code>continue</code> skips to the next iteration. Both are essential for real logic.</p></div>
<div class="box try"><span class="h"></span><p>Loop over <code>range(1, 21)</code> and print "FizzBuzz" rules: multiples of 3 → "Fizz", of 5 → "Buzz", both → "FizzBuzz", else the number. The classic.</p></div>
</div></template>

<template data-id="p1-4"><div class="content">
<p>Four containers carry almost all your data. Know when to reach for each.</p>
<h2>Lists: ordered, changeable</h2>
<pre><code class="language-python">inv = [<span class="s">"sword"</span>, <span class="s">"pickaxe"</span>, <span class="s">"bread"</span>]
inv.<span class="f">append</span>(<span class="s">"torch"</span>)        <span class="c"># add</span>
inv[<span class="n">0</span>] = <span class="s">"netherite sword"</span>  <span class="c"># replace by index</span>
<span class="k">print</span>(inv[<span class="o">-</span><span class="n">1</span>])               <span class="c"># last item: "torch"</span>
<span class="k">print</span>(inv[<span class="n">1</span>:<span class="n">3</span>])              <span class="c"># slice: items 1,2</span></code></pre>
<h2>Dicts: key → value lookups</h2>
<pre><code class="language-python">player = {<span class="s">"name"</span>: <span class="s">"Alex"</span>, <span class="s">"hp"</span>: <span class="n">20</span>, <span class="s">"xp"</span>: <span class="n">17</span>}
<span class="k">print</span>(player[<span class="s">"hp"</span>])          <span class="c"># 20</span>
player[<span class="s">"hp"</span>] = <span class="n">15</span>            <span class="c"># update</span>
player[<span class="s">"gamemode"</span>] = <span class="s">"survival"</span>  <span class="c"># add a key</span>
<span class="k">for</span> key, val <span class="k">in</span> player.<span class="f">items</span>():
    <span class="k">print</span>(key, <span class="s">"="</span>, val)</code></pre>
<h2>Tuples &amp; sets</h2>
<pre><code class="language-python">spawn = (<span class="n">0</span>, <span class="n">64</span>, <span class="n">0</span>)         <span class="c"># tuple: fixed, ordered (great for coords)</span>
online = {<span class="s">"alex"</span>, <span class="s">"steve"</span>}   <span class="c"># set: unique, unordered</span>
online.<span class="f">add</span>(<span class="s">"alex"</span>)          <span class="c"># still just two, no duplicates</span></code></pre>
<div class="box try"><span class="h"></span><p>Build a dict mapping mob names to their health. Loop over it and print only mobs with more than 20 HP. Then add the mob names to a set and print how many unique mobs you have.</p></div>
</div></template>

<template data-id="p1-5"><div class="content">
<p><strong>Functions</strong> are reusable, named blocks of logic. They take inputs (parameters) and usually <code>return</code> a result. Good code is mostly small, well-named functions.</p>
<pre><code class="language-python"><span class="k">def</span> <span class="f">ticks_for_time</span>(hour, minute=<span class="n">0</span>):
    <span class="s">"""Convert a 24h clock time to a Minecraft day tick (6am = 0)."""</span>
    seconds = hour * <span class="n">3600</span> + minute * <span class="n">60</span>
    shifted = (seconds - <span class="n">6</span> * <span class="n">3600</span>) % <span class="n">86400</span>
    <span class="k">return</span> <span class="f">round</span>(shifted / <span class="n">86400</span> * <span class="n">24000</span>)

<span class="k">print</span>(<span class="f">ticks_for_time</span>(<span class="n">12</span>))       <span class="c"># 6000  (noon)</span>
<span class="k">print</span>(<span class="f">ticks_for_time</span>(<span class="n">18</span>, <span class="n">30</span>))   <span class="c"># sunset-ish</span></code></pre>
<p>This is the <em>exact</em> math your time-sync mod uses, Python is a perfect place to prototype mod logic before writing Java.</p>
<div class="box note"><span class="h">Default &amp; keyword arguments</span><p><code>minute=0</code> is a default. Call <code>ticks_for_time(hour=9, minute=15)</code> with keywords for readability. Functions that do one thing and return a value are easy to test and reuse.</p></div>
<div class="box try"><span class="h"></span><p>Write <code>damage(hp, amount)</code> that returns the new HP but never below 0 (use <code>max()</code>). Then write <code>heal(hp, amount)</code> capped at 20 (use <code>min()</code>). Chain them.</p></div>
</div></template>

<template data-id="p1-6"><div class="content">
<p>Real programs read and write files and survive things going wrong.</p>
<h2>Reading &amp; writing</h2>
<pre><code class="language-python"><span class="c"># write</span>
<span class="k">with</span> <span class="f">open</span>(<span class="s">"whitelist.txt"</span>, <span class="s">"w"</span>) <span class="k">as</span> f:
    f.<span class="f">write</span>(<span class="s">"alex\nsteve\n"</span>)

<span class="c"># read line by line</span>
<span class="k">with</span> <span class="f">open</span>(<span class="s">"whitelist.txt"</span>) <span class="k">as</span> f:
    <span class="k">for</span> line <span class="k">in</span> f:
        <span class="k">print</span>(line.<span class="f">strip</span>())</code></pre>
<p>The <code>with</code> block auto-closes the file even if an error happens.</p>
<h2>JSON: the language of APIs</h2>
<pre><code class="language-python"><span class="k">import</span> json

config = {<span class="s">"timezone"</span>: <span class="s">"America/Los_Angeles"</span>, <span class="s">"interval"</span>: <span class="n">20</span>}
<span class="k">with</span> <span class="f">open</span>(<span class="s">"config.json"</span>, <span class="s">"w"</span>) <span class="k">as</span> f:
    json.<span class="f">dump</span>(config, f, indent=<span class="n">2</span>)

<span class="k">with</span> <span class="f">open</span>(<span class="s">"config.json"</span>) <span class="k">as</span> f:
    data = json.<span class="f">load</span>(f)
<span class="k">print</span>(data[<span class="s">"timezone"</span>])</code></pre>
<h2>Handling errors</h2>
<pre><code class="language-python"><span class="k">try</span>:
    hp = <span class="f">int</span>(<span class="f">input</span>(<span class="s">"HP? "</span>))
<span class="k">except</span> ValueError:
    <span class="k">print</span>(<span class="s">"That wasn't a number."</span>)</code></pre>
<div class="box try"><span class="h"></span><p>Write a script that loads <code>config.json</code>, but if the file is missing (<code>FileNotFoundError</code>), creates it with defaults instead of crashing. This is exactly what your mod's config loader does.</p></div>
</div></template>

<template data-id="p1-7"><div class="content">
<p>As projects grow you split code into <strong>modules</strong> and pull in libraries with <strong>pip</strong>. To keep projects isolated, each gets a <strong>virtual environment</strong>.</p>
<h2>Virtual environments</h2>
<pre><code class="language-bash">cd ~/Dev/mc-tools
python3 -m venv .venv          <span class="c"># create</span>
source .venv/bin/activate      <span class="c"># activate (prompt shows (.venv))</span>
pip install requests           <span class="c"># installs into THIS project only</span>
deactivate                     <span class="c"># leave it</span></code></pre>
<div class="box warn"><span class="h">Always use a venv</span><p>Installing packages globally creates version conflicts between projects. A venv is a clean, throwaway sandbox per project. Add <code>.venv/</code> to <code>.gitignore</code>.</p></div>
<h2>Your own modules</h2>
<pre><code class="language-python"><span class="c"># mcmath.py</span>
<span class="k">def</span> <span class="f">ticks_for_time</span>(hour):
    <span class="k">return</span> <span class="f">round</span>(((hour*<span class="n">3600</span> - <span class="n">21600</span>) % <span class="n">86400</span>) / <span class="n">86400</span> * <span class="n">24000</span>)

<span class="c"># main.py</span>
<span class="k">from</span> mcmath <span class="k">import</span> ticks_for_time
<span class="k">print</span>(<span class="f">ticks_for_time</span>(<span class="n">12</span>))</code></pre>
<h2>Pin your dependencies</h2>
<pre><code class="language-bash">pip freeze &gt; requirements.txt   <span class="c"># record exact versions</span>
pip install -r requirements.txt <span class="c"># reproduce anywhere</span></code></pre>
<div class="box try"><span class="h"></span><p>Make a project folder, create a venv, <code>pip install requests</code>, write <code>requirements.txt</code>, and confirm <code>requests</code> imports. You'll use it next to call APIs.</p></div>
</div></template>

<template data-id="p1-8"><div class="content">
<p><strong>Object-oriented programming</strong> bundles data and the functions that act on it into <strong>classes</strong>. A class is a blueprint; an <strong>object</strong> is one made from it. This is how Minecraft itself is structured (a <code>ServerLevel</code> object, a <code>Player</code> object…).</p>
<pre><code class="language-python"><span class="k">class</span> <span class="f">Player</span>:
    <span class="k">def</span> <span class="f">__init__</span>(self, name, hp=<span class="n">20</span>):
        self.name = name        <span class="c"># attributes (data)</span>
        self.hp = hp

    <span class="k">def</span> <span class="f">take_damage</span>(self, amount):   <span class="c"># method (behavior)</span>
        self.hp = <span class="f">max</span>(<span class="n">0</span>, self.hp - amount)
        <span class="k">return</span> self.hp

    <span class="k">def</span> <span class="f">is_alive</span>(self):
        <span class="k">return</span> self.hp &gt; <span class="n">0</span>

alex = <span class="f">Player</span>(<span class="s">"Alex"</span>)
alex.<span class="f">take_damage</span>(<span class="n">5</span>)
<span class="k">print</span>(alex.name, alex.hp, alex.<span class="f">is_alive</span>())</code></pre>
<h2>Inheritance</h2>
<pre><code class="language-python"><span class="k">class</span> <span class="f">Admin</span>(<span class="f">Player</span>):           <span class="c"># Admin IS-A Player</span>
    <span class="k">def</span> <span class="f">take_damage</span>(self, amount):
        <span class="k">return</span> self.hp        <span class="c"># admins are invincible</span></code></pre>
<div class="box note"><span class="h">self</span><p><code>self</code> is the object the method is called on. You never pass it explicitly, Python does. <code>__init__</code> is the constructor, run when you create the object.</p></div>
<div class="box try"><span class="h"></span><p>Add an <code>Inventory</code> class with <code>add(item)</code>, <code>remove(item)</code>, and a <code>__len__</code> method so <code>len(inv)</code> works. Give your <code>Player</code> an inventory attribute.</p></div>
</div></template>

<template data-id="p1-9"><div class="content">
<p>The features that make Python code concise and "Pythonic." You'll read these everywhere.</p>
<h2>Comprehensions</h2>
<pre><code class="language-python">nums = [<span class="n">1</span>,<span class="n">2</span>,<span class="n">3</span>,<span class="n">4</span>,<span class="n">5</span>]
squares = [n*n <span class="k">for</span> n <span class="k">in</span> nums]               <span class="c"># [1,4,9,16,25]</span>
evens   = [n <span class="k">for</span> n <span class="k">in</span> nums <span class="k">if</span> n % <span class="n">2</span> == <span class="n">0</span>]   <span class="c"># [2,4]</span>
lookup  = {p: <span class="f">len</span>(p) <span class="k">for</span> p <span class="k">in</span> [<span class="s">"alex"</span>,<span class="s">"steve"</span>]}  <span class="c"># dict comp</span></code></pre>
<h2>Generators: lazy sequences</h2>
<pre><code class="language-python"><span class="k">def</span> <span class="f">countdown</span>(n):
    <span class="k">while</span> n &gt; <span class="n">0</span>:
        <span class="k">yield</span> n          <span class="c"># produces values one at a time</span>
        n <span class="o">-</span>= <span class="n">1</span>

<span class="k">for</span> x <span class="k">in</span> <span class="f">countdown</span>(<span class="n">3</span>):
    <span class="k">print</span>(x)            <span class="c"># 3, 2, 1, without building a list</span></code></pre>
<h2>Type hints</h2>
<pre><code class="language-python"><span class="k">def</span> <span class="f">heal</span>(hp: <span class="f">int</span>, amount: <span class="f">int</span>) -&gt; <span class="f">int</span>:
    <span class="k">return</span> <span class="f">min</span>(<span class="n">20</span>, hp + amount)</code></pre>
<p>Hints don't change runtime behavior, but editors and tools (like <code>mypy</code>) use them to catch bugs. FastAPI in Part 3 uses them to validate API requests automatically.</p>
<div class="box note"><span class="h">Decorators</span><p>A <code>@decorator</code> wraps a function to add behavior. You'll meet them in FastAPI (<code>@app.get("/")</code>), just know that <code>@thing</code> above a function transforms it.</p></div>
<div class="box try"><span class="h"></span><p>Rewrite a loop that filters online admins from a player list as a single list comprehension. Add type hints to one of your earlier functions.</p></div>
</div></template>

<template data-id="p1-10"><div class="content">
<p>Time to connect Python to your world. The server has <strong>RCON</strong> enabled, a protocol for sending console commands over the network. You'll drive it from Python.</p>
<pre><code class="language-bash">source .venv/bin/activate
pip install mcrcon</code></pre>
<pre><code class="language-python"><span class="k">from</span> mcrcon <span class="k">import</span> MCRcon

HOST = <span class="s">"localhost"</span>
PASSWORD = <span class="s">"your-rcon-password"</span>   <span class="c"># from your compose.yml</span>

<span class="k">with</span> <span class="f">MCRcon</span>(HOST, PASSWORD, port=<span class="n">25575</span>) <span class="k">as</span> mcr:
    <span class="k">print</span>(mcr.<span class="f">command</span>(<span class="s">"list"</span>))            <span class="c"># who's online</span>
    mcr.<span class="f">command</span>(<span class="s">"time set day"</span>)
    mcr.<span class="f">command</span>(<span class="s">"say Python is now in control."</span>)</code></pre>
<h2>Make it useful</h2>
<pre><code class="language-python"><span class="k">def</span> <span class="f">online_players</span>(mcr) -&gt; <span class="f">list</span>[<span class="f">str</span>]:
    <span class="s">"""Parse 'There are 2 of a max of 20 players online: alex, steve'."""</span>
    resp = mcr.<span class="f">command</span>(<span class="s">"list"</span>)
    <span class="k">if</span> <span class="s">":"</span> <span class="k">not</span> <span class="k">in</span> resp:
        <span class="k">return</span> []
    names = resp.<span class="f">split</span>(<span class="s">":"</span>, <span class="n">1</span>)[<span class="n">1</span>].<span class="f">strip</span>()
    <span class="k">return</span> [n.<span class="f">strip</span>() <span class="k">for</span> n <span class="k">in</span> names.<span class="f">split</span>(<span class="s">","</span>) <span class="k">if</span> n.<span class="f">strip</span>()]</code></pre>
<div class="box warn"><span class="h">Secrets don't belong in code</span><p>Hard-coding the RCON password is fine for learning, but in real apps read it from an environment variable: <code>os.environ["RCON_PASSWORD"]</code>. Part 3 does this properly.</p>
<div class="box try"><span class="h"></span><p>Write a script that connects, lists online players using <code>online_players()</code>, and gives each of them a loaf of bread with <code>mcr.command(f"give {name} bread")</code>. You just wrote your first automation.</p></div>
</div></template>

<!-- ===== PART 2: MINECRAFT ===== -->
<template data-id="p2-1"><div class="content">
<p>Minecraft Java Edition wasn't built to be modded, the community made it moddable. <strong>Fabric</strong> is a lightweight mod loader that injects your code into the game. Before writing a mod, internalize the single most important distinction.</p>
<h2>Client vs. Server</h2>
<ul>
<li><strong>Server-side</strong> mods change <em>world state</em> the server owns, time, blocks, entities, game rules. Installed on the server; all players see the effect. (Your time-sync mod.)</li>
<li><strong>Client-side</strong> mods change <em>your own game</em>, keybinds, rendering, input, UI. Installed in your client; the server doesn't know. (Your auto-run mod.)</li>
</ul>
<p>Ask: <em>whose machine owns the thing you're changing?</em> That answers where the mod runs.</p>
<h2>Mappings: why versions matter</h2>
<p>Minecraft ships <em>obfuscated</em> (class/method names scrambled). <strong>Mappings</strong> translate those into readable names. Because the scrambling differs per version, <strong>a mod must be built against the exact MC version it runs on</strong>, which is why your server is pinned to 1.21.11.</p>
<div class="box note"><span class="h">The toolchain</span><p><strong>Gradle</strong> builds the project. <strong>Loom</strong> is the Gradle plugin that fetches Minecraft + mappings. <strong>Fabric API</strong> provides the hooks (events, registries) your mod uses. <strong>Fabric Loader</strong> loads everything at runtime.</p></div>
<div class="box try"><span class="h"></span><p>Open your two mod projects in <code>~/Dev</code>. Find the <code>"environment"</code> field in each <code>fabric.mod.json</code>. One says <code>server</code>, one says <code>client</code>. Now you know why.</p></div>
</div></template>

<template data-id="p2-2"><div class="content">
<p>Every Fabric mod has the same skeleton. Learn it once.</p>
<pre><code class="language-text">my-mod/
├── build.gradle              # dependencies + build config
├── gradle.properties         # version numbers in one place
├── settings.gradle           # the Fabric maven repo
├── gradlew / gradlew.bat      # the Gradle wrapper (no install needed)
└── src/main/
    ├── java/dev/you/MyMod.java        # your code
    └── resources/
        ├── fabric.mod.json            # the mod's manifest
        └── assets/.../lang/en_us.json # translatable text</code></pre>
<h2>fabric.mod.json: the manifest</h2>
<pre><code class="language-json">{
  <span class="s">"schemaVersion"</span>: <span class="n">1</span>,
  <span class="s">"id"</span>: <span class="s">"my-mod"</span>,
  <span class="s">"version"</span>: <span class="s">"${version}"</span>,
  <span class="s">"environment"</span>: <span class="s">"server"</span>,
  <span class="s">"entrypoints"</span>: {
    <span class="s">"server"</span>: [<span class="s">"dev.you.MyMod"</span>]
  },
  <span class="s">"depends"</span>: {
    <span class="s">"minecraft"</span>: <span class="s">"~1.21.11"</span>,
    <span class="s">"fabric-api"</span>: <span class="s">"*"</span>
  }
}</code></pre>
<p>The <strong>entrypoint</strong> tells Fabric which class to run and when. <code>server</code> for dedicated-server mods, <code>client</code> for client mods, <code>main</code> for both.</p>
<div class="box tip"><span class="h">No JDK? Build in Docker</span><p>You've been doing this already:</p><pre style="margin:8px 0"><code class="language-bash">docker run --rm -v "$PWD":/work -w /work \
  eclipse-temurin:21-jdk ./gradlew --no-daemon build</code></pre><p>The jar lands in <code>build/libs/</code>.</p></div>
<div class="box try"><span class="h"></span><p>Open <code>realtime-time-sync/gradle.properties</code> and identify the four pinned versions (Minecraft, loader, Fabric API, your mod). This file is where you'd bump versions later.</p></div>
</div></template>

<template data-id="p2-3"><div class="content">
<p>Here's a complete, minimal server mod, the core of your time-sync project, stripped to essentials.</p>
<pre><code class="language-java"><span class="k">package</span> dev.you.example;

<span class="k">import</span> net.fabricmc.api.DedicatedServerModInitializer;
<span class="k">import</span> net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
<span class="k">import</span> net.minecraft.server.level.ServerLevel;

<span class="k">public class</span> <span class="f">ExampleMod</span> <span class="k">implements</span> DedicatedServerModInitializer {
    <span class="k">private int</span> ticks = <span class="n">0</span>;

    <span class="nd">@Override</span>
    <span class="k">public void</span> <span class="f">onInitializeServer</span>() {
        <span class="c">// runs once when the server starts</span>
        ServerTickEvents.END_SERVER_TICK.<span class="f">register</span>(server -&gt; {
            <span class="k">if</span> (++ticks &gt;= <span class="n">20</span>) {        <span class="c">// 20 ticks = 1 second</span>
                ticks = <span class="n">0</span>;
                <span class="k">for</span> (ServerLevel level : server.<span class="f">getAllLevels</span>()) {
                    level.<span class="f">setDayTime</span>(<span class="n">6000</span>);  <span class="c">// pin to noon</span>
                }
            }
        });
    }
}</code></pre>
<h2>What to notice</h2>
<ul>
<li>The class <code>implements DedicatedServerModInitializer</code>, matching the <code>server</code> entrypoint.</li>
<li><code>onInitializeServer()</code> runs once at startup; it <em>registers</em> a callback.</li>
<li>The lambda runs every tick. Counting to 20 throttles work to once a second.</li>
</ul>
<div class="box note"><span class="h">Java vs. Python</span><p>Java is <em>statically typed</em> and verbose (types everywhere, semicolons, braces). The upside: the compiler catches whole classes of bugs before the game ever runs. Your Python instincts transfer, it's the same logic, more ceremony.</p></div>
<div class="box try"><span class="h"></span><p>In your time-sync project, find the real <code>currentDayTimeTicks()</code> method and compare it to the Python <code>ticks_for_time()</code> you wrote in Part 1. Same math, two languages.</p></div>
</div></template>

<template data-id="p2-4"><div class="content">
<p>Mods are <strong>event-driven</strong>: Fabric API fires events, you register callbacks. You don't call the game, the game calls you.</p>
<h2>The tick loop</h2>
<pre><code class="language-java">ServerTickEvents.END_SERVER_TICK.<span class="f">register</span>(server -&gt; {
    <span class="c">// every server tick (~20/sec)</span>
});</code></pre>
<h2>Lifecycle events</h2>
<pre><code class="language-java">ServerLifecycleEvents.SERVER_STARTED.<span class="f">register</span>(server -&gt; {
    <span class="c">// world is loaded, safe to touch levels &amp; game rules</span>
});</code></pre>
<h2>Player &amp; world events</h2>
<pre><code class="language-java"><span class="c">// react when a player joins</span>
ServerPlayConnectionEvents.JOIN.<span class="f">register</span>((handler, sender, server) -&gt; {
    ServerPlayer player = handler.player;
    player.<span class="f">sendSystemMessage</span>(Component.<span class="f">literal</span>(<span class="s">"Welcome back!"</span>));
});</code></pre>
<div class="box tip"><span class="h">Discovering events</span><p>Fabric API groups events by area: <code>ServerTickEvents</code>, <code>ServerLifecycleEvents</code>, <code>ServerPlayConnectionEvents</code>, <code>AttackBlockCallback</code>, and many more. In VS Code, type the class name and let autocomplete show you what's available.</p></div>
<div class="box try"><span class="h"></span><p>Sketch (on paper or in comments) which event you'd use for: a daily reward at midnight, a welcome message on join, and a "no PvP" rule. You're learning to think in events.</p></div>
</div></template>

<template data-id="p2-5"><div class="content">
<p>Two ways your mod interacts with game systems: setting <strong>game rules</strong> and registering <strong>commands</strong>.</p>
<h2>Game rules (the 1.21.11 way)</h2>
<p>1.21.11 redesigned game rules into a typed API. To disable the daylight cycle:</p>
<pre><code class="language-java"><span class="k">import</span> net.minecraft.world.level.gamerules.GameRules;

ServerLifecycleEvents.SERVER_STARTED.<span class="f">register</span>(server -&gt; {
    <span class="k">for</span> (ServerLevel level : server.<span class="f">getAllLevels</span>()) {
        level.<span class="f">getGameRules</span>().<span class="f">set</span>(GameRules.ADVANCE_TIME, <span class="k">false</span>, server);
    }
});</code></pre>
<div class="box warn"><span class="h">This is why you decompile</span><p>Older tutorials show <code>GameRules.RULE_DAYLIGHT</code>, that name no longer exists in 1.21.11. When code won't compile, inspect the real mapped jar with <code>javap</code> (next lesson) instead of trusting a tutorial.</p></div>
<h2>Custom commands</h2>
<pre><code class="language-java">CommandRegistrationCallback.EVENT.<span class="f">register</span>((dispatcher, reg, env) -&gt; {
    dispatcher.<span class="f">register</span>(
        Commands.<span class="f">literal</span>(<span class="s">"heal"</span>).<span class="f">executes</span>(ctx -&gt; {
            ctx.<span class="f">getSource</span>().<span class="f">getPlayer</span>().<span class="f">setHealth</span>(<span class="n">20</span>f);
            <span class="k">return</span> <span class="n">1</span>;
        })
    );
});</code></pre>
<p>Now <code>/heal</code> works in-game. Commands use Brigadier, Mojang's command framework.</p>
<div class="box try"><span class="h"></span><p>Design a <code>/spawnpoint here</code> command in pseudocode: which event registers it, what the source gives you, and what method sets the spawn. Then look up the real method names with the next lesson's technique.</p></div>
</div></template>

<template data-id="p2-6"><div class="content">
<p>Client mods register <strong>keybindings</strong> and read input, things that only exist on your machine. This is your auto-run mod, explained.</p>
<pre><code class="language-java"><span class="k">public class</span> <span class="f">AutoRun</span> <span class="k">implements</span> ClientModInitializer {
    <span class="k">private static</span> KeyMapping toggleKey;
    <span class="k">private boolean</span> autoRun = <span class="k">false</span>;

    <span class="nd">@Override</span>
    <span class="k">public void</span> <span class="f">onInitializeClient</span>() {
        toggleKey = KeyBindingHelper.<span class="f">registerKeyBinding</span>(<span class="k">new</span> KeyMapping(
            <span class="s">"key.autorun.toggle"</span>, InputConstants.Type.KEYSYM,
            GLFW.GLFW_KEY_R, KeyMapping.Category.MOVEMENT));

        ClientTickEvents.END_CLIENT_TICK.<span class="f">register</span>(client -&gt; {
            <span class="k">while</span> (toggleKey.<span class="f">consumeClick</span>()) autoRun = !autoRun;
            <span class="k">if</span> (autoRun &amp;&amp; client.player != <span class="k">null</span> &amp;&amp; client.screen == <span class="k">null</span>)
                client.options.keyUp.<span class="f">setDown</span>(<span class="k">true</span>);   <span class="c">// hold "forward"</span>
        });
    }
}</code></pre>
<h2>The three ideas</h2>
<ol>
<li><strong>Register</strong> a keybinding → appears in Options → Controls, rebindable.</li>
<li><strong>Each tick</strong>, drain presses with <code>consumeClick()</code> and flip a boolean.</li>
<li>While on, force the <strong>forward key</strong> down, the game thinks you're holding W.</li>
</ol>
<div class="box note"><span class="h">Same skeleton, different entrypoint</span><p><code>ClientModInitializer</code> + <code>"environment": "client"</code>. Everything you learned about server mods applies; only the APIs (keybinds, options) are client-only.</p></div>
<div class="box try"><span class="h"></span><p>Extend the idea: also hold <code>client.options.keySprint</code> so it's auto-<em>sprint</em>. One line. Rebuild and drop it in your client's mods folder.</p></div>
</div></template>

<template data-id="p2-7"><div class="content">
<p><strong>Mixins</strong> are the advanced superpower of Fabric: they let you weave code <em>into Minecraft's own classes</em> at load time, changing vanilla behavior that no event exposes. Power comes with sharp edges.</p>
<pre><code class="language-java"><span class="nd">@Mixin</span>(Zombie.class)
<span class="k">public class</span> <span class="f">ZombieMixin</span> {
    <span class="c">// run your code at the start of the zombie's tick</span>
    <span class="nd">@Inject</span>(method = <span class="s">"tick"</span>, at = <span class="nd">@At</span>(<span class="s">"HEAD"</span>))
    <span class="k">private void</span> <span class="f">onTick</span>(CallbackInfo ci) {
        <span class="c">// e.g. make zombies glow, count them, etc.</span>
    }
}</code></pre>
<p>You list mixins in a <code>mymod.mixins.json</code> file and reference it from <code>fabric.mod.json</code>. Common injection points: <code>@At("HEAD")</code> (before the method), <code>@At("RETURN")</code> (after), and <code>@Inject(... cancellable = true)</code> to <em>cancel</em> vanilla behavior.</p>
<div class="box warn"><span class="h">Use sparingly</span><p>Mixins touch internal code that can change between versions and can conflict with other mods. <strong>Always prefer a Fabric API event if one exists.</strong> Reach for a mixin only when there's no other hook.</p></div>
<div class="box note"><span class="h">When you'd need one</span><p>Changing mob AI, altering damage calculations, injecting into the render pipeline, tweaking world generation, places vanilla offers no event.</p></div>
<div class="box try"><span class="h"></span><p>You don't have to write one yet. Instead, browse a popular open-source Fabric mod on GitHub and find its <code>mixins</code> folder. Read one mixin and identify the target class, method, and injection point.</p></div>
</div></template>

<template data-id="p2-8"><div class="content">
<p>The single most valuable habit in modding: <strong>verify API names against the real mapped jar</strong> instead of trusting tutorials. This is how you caught the game-rule and keybinding renames in 1.21.11.</p>
<h2>Find the mapped jar</h2>
<pre><code class="language-bash">find ~/.gradle/caches/fabric-loom -path "*1.21.11*" -name "*minecraft-merged*.jar"</code></pre>
<h2>Inspect a class with javap</h2>
<pre><code class="language-bash"><span class="c"># list the methods of ServerLevel</span>
docker run --rm -v "$JAR":/mc.jar eclipse-temurin:21-jdk bash -c '
  cd /tmp &amp;&amp; jar xf /mc.jar net/minecraft/server/level/ServerLevel.class
  javap net/minecraft/server/level/ServerLevel.class | grep -i setDayTime'</code></pre>
<p>Output:</p>
<pre><code class="language-text">public void setDayTime(long);</code></pre>
<p>Now you <em>know</em> the exact method signature, no guessing, no failed builds.</p>
<div class="box tip"><span class="h">Verify before you write</span><p>When porting to a new Minecraft version, <code>javap</code> the classes you touch first. Five minutes of inspection saves an hour of cryptic compile errors. This is a pro workflow most tutorials never teach.</p></div>
<div class="box try"><span class="h"></span><p>Use the technique to confirm <code>net.minecraft.client.Options</code> really has a public <code>keyUp</code> field. Grep for <code>KeyMapping key</code> and you'll see all the movement keys.</p></div>
</div></template>

<!-- ===== PART 3: FULL STACK ===== -->
<template data-id="p3-1"><div class="content">
<p>"Full-stack" means you can build every layer of a web product: the <strong>frontend</strong> (what users see), the <strong>backend</strong> (the server logic + API), and the <strong>data</strong> (where things persist). Your capstone: a web dashboard for your Minecraft server.</p>
<h2>How a web request works</h2>
<ol>
<li>A <strong>browser</strong> (client) sends an HTTP <strong>request</strong> to a URL.</li>
<li>A <strong>server</strong> receives it, runs code, talks to a database, and returns a <strong>response</strong>.</li>
<li>The browser renders the response (HTML, or JSON it turns into UI).</li>
</ol>
<pre><code class="language-text">Browser  ──GET /api/status──▶  FastAPI backend  ──RCON──▶  Minecraft
        ◀──{"online": 2}────                    ◀──"list"──</code></pre>
<h2>HTTP verbs &amp; status codes</h2>
<ul>
<li><strong>GET</strong> read, <strong>POST</strong> create, <strong>PUT/PATCH</strong> update, <strong>DELETE</strong> remove.</li>
<li><strong>200</strong> OK, <strong>404</strong> not found, <strong>500</strong> server error, <strong>401</strong> unauthorized.</li>
</ul>
<div class="box note"><span class="h">The architecture you'll build</span><p>A FastAPI backend (Python) exposes <code>/api/status</code>. It talks to Minecraft over RCON. A frontend (HTML/CSS/JS) fetches that endpoint and renders live server stats. All of it runs in Docker Compose next to the game.</p></div>
<div class="box try"><span class="h"></span><p>Open your browser's DevTools (<kbd>F12</kbd>) → Network tab, reload any site, and watch the requests fly. Click one and read its request/response headers. This is the whole web, visible.</p></div>
</div></template>

<template data-id="p3-2"><div class="content">
<p>HTML is the <em>structure</em>, CSS is the <em>style</em>. Together they're every page you've ever seen.</p>
<h2>HTML: a tree of elements</h2>
<pre><code class="language-html">&lt;!DOCTYPE html&gt;
&lt;html&gt;
  &lt;head&gt;
    &lt;title&gt;Server Dashboard&lt;/title&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;h1&gt;My Server&lt;/h1&gt;
    &lt;p class="status"&gt;Players online: &lt;span id="count"&gt;0&lt;/span&gt;&lt;/p&gt;
    &lt;button id="refresh"&gt;Refresh&lt;/button&gt;
  &lt;/body&gt;
&lt;/html&gt;</code></pre>
<h2>CSS: selecting &amp; styling</h2>
<pre><code class="language-css"><span class="f">body</span> { font-family: sans-serif; background: <span class="s">#0c0f13</span>; color: <span class="s">#ece9e0</span>; }
<span class="f">.status</span> { font-size: <span class="n">1.2</span>rem; }          <span class="c">/* class selector */</span>
<span class="f">#count</span> { color: <span class="s">#5fcf80</span>; font-weight: bold; } <span class="c">/* id selector */</span>
<span class="f">button:hover</span> { background: <span class="s">#5fcf80</span>; }   <span class="c">/* state */</span></code></pre>
<div class="box tip"><span class="h">The box model</span><p>Every element is a box: <strong>content</strong> → <strong>padding</strong> → <strong>border</strong> → <strong>margin</strong>. Layout today is mostly <strong>flexbox</strong> (<code>display:flex</code>) and <strong>grid</strong> (<code>display:grid</code>). This very page uses both.</p></div>
<div class="box try"><span class="h"></span><p>Save that HTML to <code>dashboard.html</code>, open it in your browser, then add CSS to center the heading and give the button rounded corners (<code>border-radius</code>). Reload to see changes.</p></div>
</div></template>

<template data-id="p3-3"><div class="content">
<p><strong>JavaScript</strong> makes pages interactive, it runs in the browser, reacts to clicks, and fetches data from APIs.</p>
<h2>Selecting &amp; reacting</h2>
<pre><code class="language-javascript"><span class="k">const</span> button = document.<span class="f">getElementById</span>(<span class="s">"refresh"</span>);
<span class="k">const</span> count  = document.<span class="f">getElementById</span>(<span class="s">"count"</span>);

button.<span class="f">addEventListener</span>(<span class="s">"click"</span>, () =&gt; {
    count.textContent = <span class="s">"loading…"</span>;
});</code></pre>
<h2>Fetching data from an API</h2>
<pre><code class="language-javascript"><span class="k">async function</span> <span class="f">loadStatus</span>() {
    <span class="k">const</span> res  = <span class="k">await</span> <span class="f">fetch</span>(<span class="s">"/api/status"</span>);
    <span class="k">const</span> data = <span class="k">await</span> res.<span class="f">json</span>();        <span class="c">// {"online": 2, "players": [...]}</span>
    count.textContent = data.online;
}
<span class="f">loadStatus</span>();
<span class="f">setInterval</span>(loadStatus, <span class="n">5000</span>);             <span class="c">// refresh every 5s</span></code></pre>
<div class="box note"><span class="h">async / await</span><p>Network calls take time. <code>await</code> pauses until the response arrives without freezing the page. It's the JS cousin of waiting for a server reply, you'll see the same shape in Python.</p></div>
<div class="box try"><span class="h"></span><p>Without a backend yet, fake it: <code>const data = {online: 3}</code> instead of fetching, and wire the button to display it. You'll swap in the real <code>fetch</code> in lesson 3.6.</p></div>
</div></template>

<template data-id="p3-4"><div class="content">
<p><strong>FastAPI</strong> is a modern Python web framework. It uses the type hints you learned in Part 1 to validate data and auto-generate docs. You'll build the backend.</p>
<pre><code class="language-bash">mkdir ~/Dev/mc-dashboard &amp;&amp; cd ~/Dev/mc-dashboard
python3 -m venv .venv &amp;&amp; source .venv/bin/activate
pip install "fastapi[standard]" mcrcon</code></pre>
<pre><code class="language-python"><span class="c"># main.py</span>
<span class="k">from</span> fastapi <span class="k">import</span> FastAPI

app = <span class="f">FastAPI</span>()

<span class="nd">@app.get</span>(<span class="s">"/api/health"</span>)
<span class="k">def</span> <span class="f">health</span>():
    <span class="k">return</span> {<span class="s">"status"</span>: <span class="s">"ok"</span>}

<span class="nd">@app.get</span>(<span class="s">"/api/echo/{msg}"</span>)
<span class="k">def</span> <span class="f">echo</span>(msg: <span class="f">str</span>):
    <span class="k">return</span> {<span class="s">"you_said"</span>: msg}</code></pre>
<pre><code class="language-bash">fastapi dev main.py     <span class="c"># runs at http://localhost:8000</span></code></pre>
<p>Visit <code>http://localhost:8000/api/health</code> → JSON. Visit <code>/docs</code> → interactive API docs FastAPI built for you, free.</p>
<div class="box note"><span class="h">That @app.get is a decorator</span><p>Remember decorators from Part 1? <code>@app.get("/api/health")</code> wraps your function so FastAPI calls it whenever someone GETs that URL. The function's return value becomes JSON automatically.</p></div>
<div class="box try"><span class="h"></span><p>Add a <code>GET /api/add/{a}/{b}</code> endpoint that returns their sum. Type-hint <code>a: int, b: int</code> and watch FastAPI reject <code>/api/add/x/2</code> with a clean 422 error, validation for free.</p></div>
</div></template>

<template data-id="p3-5"><div class="content">
<p>Now wire the backend to your world. The API will open an RCON connection and translate game state into JSON.</p>
<pre><code class="language-python"><span class="c"># main.py</span>
<span class="k">import</span> os
<span class="k">from</span> fastapi <span class="k">import</span> FastAPI, HTTPException
<span class="k">from</span> mcrcon <span class="k">import</span> MCRcon

app = <span class="f">FastAPI</span>()
RCON_HOST = os.<span class="f">getenv</span>(<span class="s">"RCON_HOST"</span>, <span class="s">"localhost"</span>)
RCON_PASS = os.<span class="f">getenv</span>(<span class="s">"RCON_PASSWORD"</span>, <span class="s">""</span>)

<span class="k">def</span> <span class="f">rcon</span>(cmd: <span class="f">str</span>) -&gt; <span class="f">str</span>:
    <span class="k">try</span>:
        <span class="k">with</span> <span class="f">MCRcon</span>(RCON_HOST, RCON_PASS, port=<span class="n">25575</span>) <span class="k">as</span> m:
            <span class="k">return</span> m.<span class="f">command</span>(cmd)
    <span class="k">except</span> Exception:
        <span class="k">raise</span> <span class="f">HTTPException</span>(<span class="n">503</span>, <span class="s">"server unreachable"</span>)

<span class="nd">@app.get</span>(<span class="s">"/api/status"</span>)
<span class="k">def</span> <span class="f">status</span>():
    resp = <span class="f">rcon</span>(<span class="s">"list"</span>)            <span class="c"># "There are 2 of a max..."</span>
    players = []
    <span class="k">if</span> <span class="s">":"</span> <span class="k">in</span> resp:
        players = [p.<span class="f">strip</span>() <span class="k">for</span> p <span class="k">in</span> resp.<span class="f">split</span>(<span class="s">":"</span>,<span class="n">1</span>)[<span class="n">1</span>].<span class="f">split</span>(<span class="s">","</span>) <span class="k">if</span> p.<span class="f">strip</span>()]
    <span class="k">return</span> {<span class="s">"online"</span>: <span class="f">len</span>(players), <span class="s">"players"</span>: players}</code></pre>
<div class="box warn"><span class="h">Secrets via environment</span><p>Notice <code>os.getenv("RCON_PASSWORD")</code>, the password comes from the environment, not the source. In Compose you'll pass it in, and it never touches git.</p></div>
<div class="box tip"><span class="h">CORS</span><p>If your frontend is served from a different origin than the API, browsers block the request. Add FastAPI's <code>CORSMiddleware</code>, or, simpler, serve the frontend from the same FastAPI app (next lesson).</p></div>
<div class="box try"><span class="h"></span><p>Run <code>RCON_PASSWORD=... fastapi dev main.py</code> and hit <code>/api/status</code> while you're logged into the game. See your own name come back as JSON.</p></div>
</div></template>

<template data-id="p3-6"><div class="content">
<p>This is the payoff. You'll build a real, self-updating control panel for your server, live player count, a roster that refreshes itself, a connection light that goes red when the server's down, and buttons that fire commands back into the game. Everything from Parts 0 to 3 converges here.</p>

<h2>1 · The project layout</h2>
<p>Your dashboard folder grows one directory, a <code>static/</code> folder holding the frontend the API will serve:</p>
<pre><code class="language-text">mc-dashboard/
├── main.py            # the FastAPI backend (lessons 3.4 & 3.5)
├── requirements.txt
└── static/
    ├── index.html     # the page structure
    ├── style.css      # the look
    └── app.js         # the behavior</code></pre>

<h2>2 · Serve the frontend from FastAPI</h2>
<p>Letting the API serve the page means both come from the same origin (<code>http://localhost:8000</code>), so the browser never blocks the call, no CORS to configure. Add this to <code>main.py</code>, <strong>below</strong> your API routes:</p>
<pre><code class="language-python"><span class="k">from</span> fastapi.staticfiles <span class="k">import</span> StaticFiles

<span class="c"># ... all your @app.get("/api/...") routes go ABOVE this line ...</span>

<span class="c"># mount LAST: this catch-all claims every remaining URL</span>
app.<span class="f">mount</span>(<span class="s">"/"</span>, <span class="f">StaticFiles</span>(directory=<span class="s">"static"</span>, html=<span class="k">True</span>), name=<span class="s">"static"</span>)</code></pre>
<div class="box warn"><span class="h">Order matters</span><p>The <code>mount("/")</code> is a catch-all. Put it <em>above</em> your <code>/api/...</code> routes and it swallows them, every API call returns the HTML page instead of JSON. Define API routes first, mount static last.</p></div>

<h2>3 · The HTML: structure only</h2>
<p>HTML describes <em>what's on the page</em>, not how it looks. Every value JS will change gets an <code>id</code> so the code can find it. Save as <code>static/index.html</code>:</p>
<pre><code class="language-html">&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;
&lt;head&gt;
  &lt;meta charset="UTF-8"&gt;
  &lt;meta name="viewport" content="width=device-width, initial-scale=1"&gt;
  &lt;title&gt;Server Control&lt;/title&gt;
  &lt;link rel="stylesheet" href="style.css"&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;main class="card"&gt;
    &lt;header&gt;
      &lt;h1&gt;My Server&lt;/h1&gt;
      &lt;span id="status" class="badge"&gt;&lt;i&gt;&lt;/i&gt; connecting…&lt;/span&gt;
    &lt;/header&gt;

    &lt;p class="count"&gt;&lt;b id="online"&gt;-&lt;/b&gt; players online&lt;/p&gt;
    &lt;ul id="players" class="roster"&gt;&lt;/ul&gt;

    &lt;div class="controls"&gt;
      &lt;button data-cmd="day"&gt;☀ Set Day&lt;/button&gt;
      &lt;button data-cmd="night"&gt;☾ Set Night&lt;/button&gt;
      &lt;button data-cmd="clear"&gt;⛅ Clear Weather&lt;/button&gt;
    &lt;/div&gt;
    &lt;p id="toast" class="toast"&gt;&lt;/p&gt;
  &lt;/main&gt;

  &lt;script src="app.js"&gt;&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;</code></pre>
<div class="box note"><span class="h">Read the structure</span><p>A <code>#status</code> badge, an <code>#online</code> number, an empty <code>#players</code> list JS will fill, three command <code>&lt;button&gt;</code>s tagged with <code>data-cmd</code>, and a <code>#toast</code> line for feedback. The <code>&lt;script&gt;</code> sits last so the elements exist before the code runs.</p></div>

<h2>4 · The CSS: make it feel alive</h2>
<p>Save as <code>static/style.css</code>. The <code>.badge.up</code> / <code>.badge.down</code> classes are the trick: JavaScript toggles them to flip the light green or red.</p>
<pre><code class="language-css"><span class="f">:root</span> { --bg:#0c0f13; --card:#141a22; --line:#222a36; --ink:#ece9e0; --grass:#5fcf80; --red:#e0573d; }
<span class="f">*</span> { box-sizing:border-box; }
<span class="f">body</span> { margin:0; min-height:100vh; display:grid; place-items:center;
       background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif; }
<span class="f">.card</span> { width:min(440px,92vw); background:var(--card); border:1px solid var(--line);
        border-radius:16px; padding:28px; }
<span class="f">header</span> { display:flex; align-items:center; justify-content:space-between; }
<span class="f">h1</span> { font-size:22px; margin:0; }
<span class="f">.badge</span> { font-size:13px; display:flex; align-items:center; gap:7px; color:#8a93a0; }
<span class="f">.badge i</span> { width:9px; height:9px; border-radius:50%; background:#8a93a0; }
<span class="f">.badge.up</span> { color:var(--grass); } <span class="f">.badge.up i</span> { background:var(--grass); box-shadow:0 0 8px var(--grass); }
<span class="f">.badge.down</span> { color:var(--red); } <span class="f">.badge.down i</span> { background:var(--red); }
<span class="f">.count</span> { font-size:18px; margin:22px 0 6px; }
<span class="f">.count b</span> { color:var(--grass); font-size:26px; }
<span class="f">.roster</span> { list-style:none; padding:0; margin:0 0 20px; display:flex; flex-wrap:wrap; gap:8px; min-height:24px; }
<span class="f">.roster li</span> { background:#0a0d11; border:1px solid var(--line); border-radius:8px; padding:4px 10px; font-size:14px; }
<span class="f">.controls</span> { display:flex; gap:10px; flex-wrap:wrap; }
<span class="f">button</span> { flex:1; cursor:pointer; background:#0a0d11; color:var(--ink); border:1px solid var(--line);
         border-radius:10px; padding:11px; font-size:14px; transition:.15s; }
<span class="f">button:hover:not(:disabled)</span> { border-color:var(--grass); color:var(--grass); }
<span class="f">button:disabled</span> { opacity:.4; cursor:not-allowed; }
<span class="f">.toast</span> { min-height:18px; margin:14px 0 0; font-size:13px; }</code></pre>

<h2>5 · The JavaScript: bring it to life</h2>
<p>Save as <code>static/app.js</code>. This is the heart: a polling loop that fetches status and re-renders, plus click handlers that POST commands. Read the comments.</p>
<pre><code class="language-javascript"><span class="c">// grab elements once</span>
<span class="k">const</span> $ = (id) =&gt; document.<span class="f">getElementById</span>(id);
<span class="k">const</span> statusEl = $(<span class="s">"status"</span>), onlineEl = $(<span class="s">"online"</span>),
      rosterEl = $(<span class="s">"players"</span>), toastEl = $(<span class="s">"toast"</span>);

<span class="c">// --- 1. poll the API and render ---</span>
<span class="k">async function</span> <span class="f">refresh</span>() {
  <span class="k">try</span> {
    <span class="k">const</span> res = <span class="k">await</span> <span class="f">fetch</span>(<span class="s">"/api/status"</span>);
    <span class="k">if</span> (!res.ok) <span class="k">throw new</span> <span class="f">Error</span>(res.status);
    <span class="k">const</span> data = <span class="k">await</span> res.<span class="f">json</span>();          <span class="c">// {online, players}</span>

    statusEl.className = <span class="s">"badge up"</span>;
    statusEl.innerHTML = <span class="s">"&lt;i&gt;&lt;/i&gt; online"</span>;
    onlineEl.textContent = data.online;
    rosterEl.innerHTML = data.players.length
      ? data.players.<span class="f">map</span>(p =&gt; <span class="s">`&lt;li&gt;${p}&lt;/li&gt;`</span>).<span class="f">join</span>(<span class="s">""</span>)
      : <span class="s">`&lt;li style="opacity:.5"&gt;nobody online&lt;/li&gt;`</span>;
  } <span class="k">catch</span> (err) {
    <span class="c">// server down or unreachable, show it clearly instead of freezing</span>
    statusEl.className = <span class="s">"badge down"</span>;
    statusEl.innerHTML = <span class="s">"&lt;i&gt;&lt;/i&gt; offline"</span>;
    onlineEl.textContent = <span class="s">"-"</span>;
    rosterEl.innerHTML = <span class="s">""</span>;
  }
}

<span class="c">// --- 2. send a command when a button is clicked ---</span>
<span class="k">async function</span> <span class="f">sendCommand</span>(cmd, btn) {
  btn.disabled = <span class="k">true</span>;                          <span class="c">// no double-clicks</span>
  toastEl.textContent = <span class="s">""</span>;
  <span class="k">try</span> {
    <span class="k">const</span> res = <span class="k">await</span> <span class="f">fetch</span>(<span class="s">`/api/command/${cmd}`</span>, { method: <span class="s">"POST"</span> });
    <span class="k">const</span> data = <span class="k">await</span> res.<span class="f">json</span>();
    toastEl.style.color = res.ok ? <span class="s">"#5fcf80"</span> : <span class="s">"#e0573d"</span>;
    toastEl.textContent = data.detail || data.result || <span class="s">"done ✓"</span>;
    <span class="f">refresh</span>();                                  <span class="c">// reflect the change right away</span>
  } <span class="k">catch</span> {
    toastEl.style.color = <span class="s">"#e0573d"</span>;
    toastEl.textContent = <span class="s">"request failed"</span>;
  } <span class="k">finally</span> {
    btn.disabled = <span class="k">false</span>;
  }
}

<span class="c">// wire every button by its data-cmd attribute</span>
document.<span class="f">querySelectorAll</span>(<span class="s">"button[data-cmd]"</span>).<span class="f">forEach</span>(btn =&gt;
  btn.<span class="f">addEventListener</span>(<span class="s">"click"</span>, () =&gt; <span class="f">sendCommand</span>(btn.dataset.cmd, btn)));

<span class="c">// --- 3. start the loop ---</span>
<span class="f">refresh</span>();
<span class="f">setInterval</span>(refresh, <span class="n">4000</span>);                     <span class="c">// re-check every 4 seconds</span></code></pre>
<div class="box note"><span class="h">async / await, again</span><p>Both functions are <code>async</code> because network calls take time. <code>await</code> pauses that function until the response lands, without freezing the page, exactly the shape you saw in Python. The <code>try/catch/finally</code> means a dead server shows "offline" instead of a broken page, and buttons always re-enable.</p></div>

<h2>6 · The command endpoint: safely</h2>
<p>The buttons POST to <code>/api/command/{cmd}</code>. <strong>Never</strong> pass raw web text straight to RCON, that's a remote backdoor into your server. Instead map short, safe keys to fixed commands (an <em>allowlist</em>). Add to <code>main.py</code>:</p>
<pre><code class="language-python"><span class="k">from</span> fastapi <span class="k">import</span> HTTPException

<span class="c"># only these run, the web cannot trigger anything else</span>
ALLOWED = {
    <span class="s">"day"</span>:   <span class="s">"time set day"</span>,
    <span class="s">"night"</span>: <span class="s">"time set night"</span>,
    <span class="s">"clear"</span>: <span class="s">"weather clear"</span>,
}

<span class="nd">@app.post</span>(<span class="s">"/api/command/{cmd}"</span>)
<span class="k">def</span> <span class="f">run_command</span>(cmd: <span class="f">str</span>):
    <span class="k">if</span> cmd <span class="k">not in</span> ALLOWED:
        <span class="k">raise</span> <span class="f">HTTPException</span>(<span class="n">400</span>, <span class="s">f"unknown command: {cmd}"</span>)
    result = <span class="f">rcon</span>(ALLOWED[cmd])          <span class="c"># rcon() helper from lesson 3.5</span>
    <span class="k">return</span> {<span class="s">"result"</span>: result <span class="k">or</span> <span class="s">"ok"</span>}</code></pre>
<div class="box warn"><span class="h">This is real security</span><p>An allowlist is the difference between "three safe buttons" and "anyone who reaches your dashboard can <code>/op</code> themselves." Whenever the web can trigger server actions, constrain <em>exactly</em> what's possible. Lesson 3.9 layers authentication on top so only you can press them.</p></div>

<h2>7 · Run the whole thing</h2>
<pre><code class="language-bash">cd ~/Dev/mc-dashboard &amp;&amp; source .venv/bin/activate
RCON_PASSWORD=your-rcon-password fastapi dev main.py</code></pre>
<p>Open <code>http://localhost:8000</code>. The badge turns green, your name appears when you log in, and the buttons change the sky in your world. Now stop the Minecraft container, within four seconds the badge flips red on its own. That's your error handling, working.</p>
<div class="box tip"><span class="h">Why polling, and what beats it</span><p>Re-fetching every 4 s is simple and totally fine here. For instant updates without the steady stream of requests, <strong>WebSockets</strong> let the server <em>push</em> changes the moment they happen, the upgrade waiting for you in the capstone (3.9).</p></div>
<div class="box try"><span class="h"></span><p>Ship a feature across the whole stack: add <code>"rain": "weather rain"</code> to <code>ALLOWED</code> <em>and</em> a <code>&lt;button data-cmd="rain"&gt;</code> to the HTML. Then break it on purpose, stop the server and confirm the badge goes red and the toast reads "request failed." Handling failure is half of real engineering.</p></div>
</div></template>

<template data-id="p3-7"><div class="content">
<p>Memory disappears when the server restarts. <strong>Databases</strong> persist data. Start with <strong>SQLite</strong> (a single file, zero setup), graduate to <strong>PostgreSQL</strong> (a real server) when you need concurrency.</p>
<h2>SQLite in Python (built in)</h2>
<pre><code class="language-python"><span class="k">import</span> sqlite3

con = sqlite3.<span class="f">connect</span>(<span class="s">"stats.db"</span>)
con.<span class="f">execute</span>(<span class="s">"""CREATE TABLE IF NOT EXISTS logins(
    player TEXT, ts TEXT DEFAULT CURRENT_TIMESTAMP)"""</span>)

<span class="c"># record a login</span>
con.<span class="f">execute</span>(<span class="s">"INSERT INTO logins(player) VALUES (?)"</span>, (<span class="s">"alex"</span>,))
con.<span class="f">commit</span>()

<span class="c"># query</span>
<span class="k">for</span> row <span class="k">in</span> con.<span class="f">execute</span>(<span class="s">"SELECT player, COUNT(*) FROM logins GROUP BY player"</span>):
    <span class="k">print</span>(row)</code></pre>
<div class="box warn"><span class="h">Always use parameters</span><p>Pass values as <code>(?)</code> placeholders, never by string-building SQL. Concatenating user input into SQL is how <strong>SQL injection</strong> attacks happen.</p></div>
<h2>The leap to Postgres</h2>
<p>Same SQL, but a networked server that many clients can hit at once. You run it as, what else, a Docker service. An <strong>ORM</strong> like SQLAlchemy lets you work with Python objects instead of raw SQL once tables get complex.</p>
<div class="box try"><span class="h"></span><p>In your dashboard's <code>/api/status</code>, log each seen player into SQLite. Add a <code>GET /api/leaderboard</code> that returns login counts per player, ordered. Render it on the page.</p></div>
</div></template>

<template data-id="p3-8"><div class="content">
<p>Now bring it all together: run your dashboard as another service in the <em>same</em> Compose stack as Minecraft, so one <code>docker compose up</code> launches everything.</p>
<pre><code class="language-yaml"><span class="k">services</span>:
  <span class="f">minecraft-fabric</span>:
    <span class="k">image</span>: <span class="s">itzg/minecraft-server</span>
    <span class="c"># ...your existing config...</span>

  <span class="f">dashboard</span>:
    <span class="k">build</span>: <span class="s">./mc-dashboard</span>      <span class="c"># build from a Dockerfile</span>
    <span class="k">ports</span>:
      - <span class="s">"8000:8000"</span>
    <span class="k">environment</span>:
      <span class="f">RCON_HOST</span>: <span class="s">"minecraft-fabric"</span>   <span class="c"># reach the game by service name!</span>
      <span class="f">RCON_PASSWORD</span>: <span class="s">"your-rcon-password"</span>
    <span class="k">depends_on</span>:
      - <span class="s">minecraft-fabric</span></code></pre>
<p>Inside a Compose network, services find each other <strong>by name</strong>, your API connects to <code>minecraft-fabric:25575</code>, no IP addresses needed.</p>
<h2>The Dockerfile</h2>
<pre><code class="language-text"># mc-dashboard/Dockerfile
FROM python:3.12-slim
WORKDIR /app
COPY requirements.txt .
RUN pip install -r requirements.txt
COPY . .
CMD ["fastapi", "run", "main.py", "--port", "8000"]</code></pre>
<div class="box note"><span class="h">You've come full circle</span><p>The Docker/Compose skills from Part 0 now deploy software <em>you wrote</em>. This is real deployment, the same pattern scales to a cloud VM.</p></div>
<div class="box try"><span class="h"></span><p>Write the Dockerfile, add the service, run <code>docker compose up -d --build</code>, and load the dashboard. Your whole stack now starts with one command.</p></div>
</div></template>

<template data-id="p3-9"><div class="content">
<p>You've built every layer. Here's how to turn these pieces into the portfolio and skills of a full-stack engineer.</p>
<h2>The capstone project</h2>
<p>Grow the dashboard into a real app:</p>
<ul>

<template data-id="bonus"><div class="content">
<p>You did it. Every lesson, every quest, all the way through. This chapter stayed hidden until now, and it's the most fun thing in the whole book. Time to bolt an AI brain onto your server.</p>
<p>The goal: a chat box where you type plain English like "make it day and stop the rain," and an AI turns that into real server commands and runs them. It's the natural next step after the dashboard you built in Part 3, and it ties together RCON, your backend, and a language model.</p>

<h2>The big picture</h2>
<p>Here's the whole flow. Nothing magic, just the pieces you already know plus one new one (the model):</p>
<pre><code class="language-text">You type:  "make it day and clear the weather"
   │
   ▼
Browser chat  ──►  FastAPI  ──►  local AI model  (+ a local copy of the
                                   │               real command reference)
                                   │  returns JSON: {command, say}
                                   ▼
                            check the command against the reference  (safety!)
                                   │
                                   ▼
                            run it over RCON
                                   │
                   result or error fed back into the chat ──► model can retry</code></pre>

<h2>Local or paid API? This book stays local.</h2>
<p>You can run the AI two ways. A paid cloud API (like the big-name providers) is the easy button, but it needs an account and a credit card, which is a hard no if you're a kid or just don't want a bill. So the default here is a <strong>local model</strong> that runs on your own machine. It's free, it's private, it works offline, and there's something satisfying about running your own AI.</p>
<div class="box note"><span class="h">The trade-offs</span><p>Small local models are not as smart as the giant cloud ones. Two things keep them reliable here: the model gets the real command reference to work from, and its answer gets double checked before anything runs. On a Raspberry Pi or an older laptop, replies take a few seconds. That's fine for an admin console.</p></div>

<h2>1. Install Ollama and pull a model</h2>
<p>Ollama is the easiest way to run a model locally. On Linux or WSL:</p>
<pre><code class="language-bash">curl -fsSL https://ollama.com/install.sh | sh</code></pre>
<p>On a Mac, download the Ollama app from ollama.com instead. Then pull a model that fits your hardware:</p>
<pre><code class="language-bash"><span class="c"># good default on a normal laptop</span>
ollama pull qwen2.5:3b
<span class="c"># safer if RAM is tight</span>
ollama pull qwen2.5:1.5b
<span class="c"># tiny, for a Raspberry Pi 5 or an old machine</span>
ollama pull qwen2.5:0.5b</code></pre>
<pre><code class="language-bash"><span class="c"># add the python client to your dashboard project</span>
source .venv/bin/activate
pip install ollama</code></pre>

<h2>2. Give it the real commands (grounding)</h2>
<p>Here's the key insight: a small model is great at understanding language, but it can't be trusted to have memorized every Minecraft command and its exact syntax. Left on its own it might invent a command that doesn't exist. The fix is to stop relying on its memory and hand it the real reference instead.</p>
<p>So prefetch the commands you want to support into a local file once, store it next to your code, and feed it to the model in the prompt. The model then works from the actual commands, not its guesses. This trick has a name: <strong>grounding</strong>. It's the simple cousin of what people call RAG.</p>
<p>Save this as <code>commands.json</code>. It's your own copy of the documentation, and you own it, so you can add to it any time:</p>
<pre><code class="language-json">{
  <span class="s">"time set"</span>:   { <span class="s">"syntax"</span>: <span class="s">"time set &lt;day|night|noon|midnight|number&gt;"</span>, <span class="s">"example"</span>: <span class="s">"time set day"</span> },
  <span class="s">"weather"</span>:    { <span class="s">"syntax"</span>: <span class="s">"weather &lt;clear|rain|thunder&gt; [seconds]"</span>,    <span class="s">"example"</span>: <span class="s">"weather clear"</span> },
  <span class="s">"say"</span>:        { <span class="s">"syntax"</span>: <span class="s">"say &lt;message&gt;"</span>,                          <span class="s">"example"</span>: <span class="s">"say Restarting soon"</span> },
  <span class="s">"give"</span>:       { <span class="s">"syntax"</span>: <span class="s">"give &lt;player&gt; &lt;item&gt; [count]"</span>,            <span class="s">"example"</span>: <span class="s">"give @a bread 3"</span> },
  <span class="s">"tp"</span>:         { <span class="s">"syntax"</span>: <span class="s">"tp &lt;player&gt; &lt;target&gt;"</span>,                    <span class="s">"example"</span>: <span class="s">"tp Alex Steve"</span> },
  <span class="s">"gamemode"</span>:   { <span class="s">"syntax"</span>: <span class="s">"gamemode &lt;survival|creative|adventure|spectator&gt; [player]"</span>, <span class="s">"example"</span>: <span class="s">"gamemode creative Alex"</span> },
  <span class="s">"difficulty"</span>: { <span class="s">"syntax"</span>: <span class="s">"difficulty &lt;peaceful|easy|normal|hard&gt;"</span>,   <span class="s">"example"</span>: <span class="s">"difficulty normal"</span> }
}</code></pre>
<div class="box tip"><span class="h">Where this list comes from</span><p>This list is seeded with the common admin commands so you can run right away. The full, official list lives on the Minecraft Wiki's commands page. Whenever you want a new power, copy that command's syntax into this file. The model can only use what's in here, so this one file is both its instruction manual and your safety list.</p></div>

<h2>3. Build the prompt from that file</h2>
<p>Load <code>commands.json</code>, turn it into a short reference, and put it in the system prompt. Also ask the model to answer in a strict JSON shape so a small model can't wander off: just the <code>command</code> to run and a friendly <code>say</code> line.</p>
<pre><code class="language-python"><span class="k">import</span> json
<span class="k">from</span> ollama <span class="k">import</span> chat
<span class="k">from</span> pydantic <span class="k">import</span> BaseModel

MODEL = <span class="s">"qwen2.5:3b"</span>
COMMANDS = json.<span class="f">load</span>(<span class="f">open</span>(<span class="s">"commands.json"</span>))

<span class="c"># turn the file into a compact reference the model can read</span>
REFERENCE = <span class="s">"\n"</span>.<span class="f">join</span>(<span class="s">f"- {name}: {info['syntax']}  (example: {info['example']})"</span>
                       <span class="k">for</span> name, info <span class="k">in</span> COMMANDS.<span class="f">items</span>())

SYSTEM = {<span class="s">"role"</span>: <span class="s">"system"</span>, <span class="s">"content"</span>: (
  <span class="s">"You are an admin assistant for a Minecraft server.\n"</span>
  <span class="s">"You may ONLY use commands from this reference:\n"</span> + REFERENCE +
  <span class="s">"\nReturn the single exact command to run, with no leading slash. "</span>
  <span class="s">"If nothing fits, return an empty command and explain in 'say'. "</span>
  <span class="s">"Always include a short, friendly 'say'."</span>
)}

SCHEMA = {
  <span class="s">"type"</span>: <span class="s">"object"</span>,
  <span class="s">"properties"</span>: {
    <span class="s">"command"</span>: {<span class="s">"type"</span>: <span class="s">"string"</span>},
    <span class="s">"say"</span>:     {<span class="s">"type"</span>: <span class="s">"string"</span>},
  },
  <span class="s">"required"</span>: [<span class="s">"command"</span>, <span class="s">"say"</span>],
}</code></pre>

<h2>4. The backend endpoint</h2>
<p>The model proposes a command, but <strong>your code</strong> decides whether it runs. The check: the command must start with one of the names from <code>commands.json</code>. If it isn't in the reference, it gets refused. That refusal is the most important part of the whole project.</p>
<pre><code class="language-python"><span class="k">class</span> <span class="f">AiRequest</span>(BaseModel):
    message: <span class="f">str</span>
    history: <span class="f">list</span> = []     <span class="c"># prior turns, so it remembers context</span>

<span class="k">def</span> <span class="f">is_allowed</span>(cmd):
    <span class="k">return</span> <span class="f">bool</span>(cmd) <span class="k">and</span> <span class="f">any</span>(cmd.<span class="f">startswith</span>(name) <span class="k">for</span> name <span class="k">in</span> COMMANDS)

<span class="nd">@app.post</span>(<span class="s">"/api/ai"</span>)
<span class="k">def</span> <span class="f">ai</span>(req: AiRequest):
    messages = [SYSTEM] + req.history + [{<span class="s">"role"</span>:<span class="s">"user"</span>,<span class="s">"content"</span>: req.message}]
    out = <span class="f">chat</span>(model=MODEL, messages=messages, format=SCHEMA)
    data = json.<span class="f">loads</span>(out.message.content)

    cmd = (data.<span class="f">get</span>(<span class="s">"command"</span>) <span class="k">or</span> <span class="s">""</span>).<span class="f">strip</span>().<span class="f">lstrip</span>(<span class="s">"/"</span>)
    result = error = <span class="k">None</span>
    <span class="k">if</span> <span class="f">is_allowed</span>(cmd):
        <span class="k">try</span>:
            result = <span class="f">rcon</span>(cmd)            <span class="c"># the helper from lesson 3.5</span>
        <span class="k">except</span> Exception <span class="k">as</span> e:
            error = <span class="f">str</span>(e)
    <span class="k">elif</span> cmd:
        error = <span class="s">f"'{cmd}' is not in my command reference, so I won't run it."</span>
    <span class="k">return</span> {<span class="s">"say"</span>: data.<span class="f">get</span>(<span class="s">"say"</span>),
            <span class="s">"command"</span>: cmd <span class="k">if</span> <span class="f">is_allowed</span>(cmd) <span class="k">else</span> <span class="k">None</span>,
            <span class="s">"result"</span>: result, <span class="s">"error"</span>: error}</code></pre>
<div class="box warn"><span class="h">The model never runs commands. Your code does.</span><p>This is the whole safety story. The model can only suggest a command, and <code>is_allowed</code> only lets through commands that are actually in your reference file. Even if the model goes sideways, the worst it can do is suggest something off the list, and your code throws it away. Never send raw model text straight to RCON.</p></div>

<h2>5. Let it learn from mistakes</h2>
<p>Here's a nice touch. When a command fails, hand the error back to the model so it can try again, the same way a person would. Because <code>history</code> goes on every call, the conversation remembers what happened. This version gives the model one automatic retry with the error as a hint:</p>
<pre><code class="language-python"><span class="k">def</span> <span class="f">ask_with_retry</span>(req: AiRequest):
    messages = [SYSTEM] + req.history + [{<span class="s">"role"</span>:<span class="s">"user"</span>,<span class="s">"content"</span>: req.message}]
    last_error = <span class="k">None</span>
    <span class="k">for</span> attempt <span class="k">in</span> <span class="f">range</span>(<span class="n">2</span>):
        out = <span class="f">chat</span>(model=MODEL, messages=messages, format=SCHEMA)
        data = json.<span class="f">loads</span>(out.message.content)
        cmd = (data.<span class="f">get</span>(<span class="s">"command"</span>) <span class="k">or</span> <span class="s">""</span>).<span class="f">strip</span>().<span class="f">lstrip</span>(<span class="s">"/"</span>)
        <span class="k">if</span> <span class="k">not</span> <span class="f">is_allowed</span>(cmd):
            <span class="k">return</span> data, <span class="k">None</span>, last_error
        <span class="k">try</span>:
            <span class="k">return</span> data, <span class="f">rcon</span>(cmd), <span class="k">None</span>
        <span class="k">except</span> Exception <span class="k">as</span> e:
            last_error = <span class="f">str</span>(e)
            <span class="c"># feed the failure back in and let it try once more</span>
            messages.<span class="f">append</span>({<span class="s">"role"</span>:<span class="s">"assistant"</span>,<span class="s">"content"</span>: out.message.content})
            messages.<span class="f">append</span>({<span class="s">"role"</span>:<span class="s">"user"</span>,
                <span class="s">"content"</span>: <span class="s">f"That failed with: {last_error}. Try a valid command from the reference."</span>})
    <span class="k">return</span> data, <span class="k">None</span>, last_error</code></pre>

<h2>6. The chat front end</h2>
<p>A simple chat box in your <code>static/</code> page. It keeps a running <code>log</code> so context carries between messages:</p>
<pre><code class="language-html">&lt;div id="chat"&gt;&lt;/div&gt;
&lt;input id="msg" placeholder="tell the server what to do..."&gt;

&lt;script&gt;
const log = [];
const chat = document.getElementById("chat");

function bubble(who, text){
  const d = document.createElement("div");
  d.className = "bubble " + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

async function send(text){
  bubble("you", text);
  const res = await fetch("/api/ai", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text, history: log })
  });
  const d = await res.json();
  log.push({ role:"user", content:text });
  log.push({ role:"assistant", content: JSON.stringify(d) });
  let line = d.say;
  if (d.command) line += `   (ran: ${d.command})`;
  if (d.error)   line += `   note: ${d.error}`;
  bubble("ai", line);
}

document.getElementById("msg").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.value.trim()) {
    send(e.target.value.trim());
    e.target.value = "";
  }
});
&lt;/script&gt;</code></pre>
<p>Run Ollama in the background, start your FastAPI app, open the page, and type "make it day and clear the weather." Watch your world change from a sentence.</p>

<div class="box note"><span class="h">Want the easy mode later?</span><p>You can swap the local model for a paid cloud API. The shape is identical: send the same system prompt with the same reference, ask for the same JSON, and keep the exact same <code>is_allowed</code> check. The only changes are an API key (kept in an environment variable, never in your code) and the cost per call. For kids and for learning, local is the better call.</p></div>

<h2>Where to go from here</h2>
<p>You now have an AI that controls a real game server through a reference you prefetched and a safety check you wrote. That same pattern, ground the model in real docs and validate its output, is exactly how serious AI agents work. Make it yours: add commands to <code>commands.json</code>, give the model the live player list so it can teleport people by name, or add a login so only you can use it (see the capstone in 3.9). If your reference ever grows huge, that's when you'd reach for real RAG: store the docs as embeddings and pull in only the relevant lines per request.</p>
<p>Thanks for going all the way through. Go build something nobody's seen before.</p>
